<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Interest Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17; --bg2: #181625;
    --text: #e8e4f0; --text-dim: #7a7490;
    --accent: #c9a96e; --border: rgba(201,169,110,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.18) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 55%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 40%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.14) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.18) 0%, transparent 100%);
  }
  header {
    position: relative; z-index: 10; padding: 20px 30px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; }
  header p { font-size: 11px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0.04em; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  button { font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.07em; cursor: pointer; border-radius: 4px; transition: all 0.18s; padding: 6px 13px; text-transform: uppercase; }
  #download-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #download-btn:hover { background: rgba(201,169,110,0.1); }
  #reset-btn { background: transparent; color: var(--text-dim); border: 1px solid rgba(122,116,144,0.35); }
  #reset-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .layout { position: relative; z-index: 1; display: flex; height: calc(100vh - 78px); }
  .sidebar { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 14px 0; overflow-y: auto; background: rgba(15,14,23,0.75); }
  .sidebar-section { padding: 0 13px 13px; }
  .sidebar-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); font-weight: 500; margin-bottom: 7px; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 4px; cursor: pointer; transition: background 0.13s; margin-bottom: 2px; font-size: 12px; font-weight: 400; color: var(--text); border: 1px solid transparent; user-select: none; }
  .chip:hover { background: rgba(255,255,255,0.05); }
  .chip.active { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
  .chip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .chip-count { margin-left: auto; font-size: 9px; color: var(--text-dim); background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 10px; }
  .divider { height: 1px; background: var(--border); margin: 10px 13px; }
  .graph-area { flex: 1; position: relative; overflow: hidden; }
  canvas#graph { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas#graph.dragging { cursor: grabbing; }
  #tooltip { position: absolute; pointer-events: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 13px; font-size: 12px; max-width: 220px; display: none; z-index: 100; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  #tooltip .tip-title { font-family: 'Cinzel', serif; font-size: 13px; color: var(--accent); margin-bottom: 5px; font-weight: 400; }
  #tooltip .tip-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: var(--text); font-weight: 300; }
  #tooltip .tip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  #multibar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(20,18,35,0.94); border: 1px solid var(--border); border-radius: 20px; padding: 5px 16px; font-size: 11px; color: var(--accent); display: none; z-index: 50; letter-spacing: 0.05em; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
  #legend { position: absolute; bottom: 14px; left: 14px; font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em; }
  .leg-row { margin-top: 5px; display: flex; align-items: center; gap: 7px; }
  .leg-rainbow { width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(to right, #e84040, #e8a040, #e8e040, #40e860, #40c8e8, #4060e8, #9040e8); }
  .leg-solid { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); }
  .leg-dashed { width: 12px; height: 12px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,0.3); }
  #hint { position: absolute; bottom: 14px; right: 14px; font-size: 10px; color: var(--text-dim); text-align: right; letter-spacing: 0.04em; line-height: 1.7; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    header { padding: 14px 16px 10px; }
    header h1 { font-size: 16px; }
    header p { display: none; }
    #download-btn { display: none; }
    .layout { height: calc(100vh - 58px); }
    .sidebar { display: none; }
    .graph-area { width: 100%; }
    #legend { bottom: 56px; }
    #hint { display: none; }
    #mobile-hint {
      display: block !important;
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em;
      white-space: nowrap; text-align: center;
    }
  }
  #mobile-hint { display: none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Friend Interest Map</h1>
    <p>Select multiple people or interests to find overlap · Click empty space to clear</p>
  </div>
  <div class="header-actions">
    <button id="reset-btn">Reset</button>
    <button id="download-btn">⬇ Download View</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">People</div>
      <div id="person-list"></div>
    </div>
    <div class="divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Interests — most people → purple</div>
      <div id="interest-list"></div>
    </div>
  </aside>
  <div class="graph-area">
    <canvas id="graph"></canvas>
    <div id="tooltip"></div>
    <div id="multibar"></div>
    <div id="legend">
      <div class="leg-row"><span class="leg-rainbow"></span> <span>interests: red = fewest · purple = most</span></div>
      <div class="leg-row" style="margin-top:8px"><span class="leg-solid"></span> Interest</div>
      <div class="leg-row"><span class="leg-dashed" style="border-color:rgba(138,136,152,0.6)"></span> Person</div>
    </div>
    <div id="hint">Scroll to zoom · Drag to pan<br>Click empty space to clear</div>
    <div id="mobile-hint">Pinch to zoom · Drag to pan · Tap to select</div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  DATA  — edit this section to add/remove people and interests               ║
// ║  Format: 'Person Name': ['Interest 1', 'Interest 2', ...]                   ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const PEOPLE_DATA = {
  Adam:    ['Music'],
  Alex:    ['Resident Evil', 'Dead by Daylight', 'Reading', 'Gacha Games', 'MMOs', 'Coding', 'Owns A Dog', 'Singing / Instrument'],
  Cherry:  ['Coding', 'Bird Watching'],
  Connor:  ['Coding', 'Bird Watching', 'Owns A Cat'],
  Daniel:  ['Lethal Company', 'Drawing', 'Gacha Games', 'Coding', 'MMOs', 'Painting', 'Movies', 'Music', 'Owns A Dog'],
  Dusan:   ['Music', 'TTRPGs', 'Reading', 'MMOs', 'Movies', 'Singing / Instrument', 'Owns A Dog'],
  Frankie: ['Movies'],
  Isabel:  ['Movies', 'Dead by Daylight', 'Lethal Company', 'Music', 'TTRPGs', 'Writing', 'Horror Movies', 'Coding', 'Bird Watching', 'Owns A Dog'],
  Jessica: ['Dead by Daylight', 'Drawing', 'TTRPGs', 'Painting', 'Writing', 'Reading', 'Gacha Games', 'Singing / Instrument', 'Owns A Dog'],
  Meg:     ['Resident Evil', 'Dead by Daylight', 'Lethal Company', 'Drawing', 'Music', 'Writing', 'Reading', 'Horror Movies', 'Coding', 'Owns A Cat'],
  Sarina:  ['Movies', 'Dead by Daylight', 'Horror Movies'],
  Troy:    ['Resident Evil', 'Movies', 'Dead by Daylight', 'Drawing', 'Writing'],
  Tyler:   ['Resident Evil', 'Dead by Daylight', 'TTRPGs', 'Painting', 'Writing', 'Reading', 'Gacha Games', 'MMOs'],
};

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  DATA PROCESSING — builds the interest→people map from PEOPLE_DATA          ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Data = (() => {
  // Build CATS (interest → [people]) from PEOPLE_DATA
  const cats = {};
  for (const [person, interests] of Object.entries(PEOPLE_DATA)) {
    for (const interest of interests) {
      if (!cats[interest]) cats[interest] = [];
      cats[interest].push(person);
    }
  }

  // personCats is just PEOPLE_DATA
  const personCats = PEOPLE_DATA;

  // Sorted lists
  const allPeople = Object.keys(PEOPLE_DATA).sort();
  const allCatsByCount = Object.keys(cats).sort((a, b) => cats[b].length - cats[a].length);
  const allCatsAlpha   = [...allCatsByCount].sort();

  return { cats, personCats, allPeople, allCatsByCount, allCatsAlpha };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  COLORS — rainbow scale: red = fewest members, purple = most                ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Colors = (() => {
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const hex = x => Math.round(x * 255).toString(16).padStart(2, '0');
    return '#' + hex(f(0)) + hex(f(8)) + hex(f(4));
  }

  // t=0 → red, t=1 → violet/purple
  function rainbow(t) {
    return hslToHex(t * 270, 85, 58);
  }

  // Assign rainbow colors to interests by member count rank
  const catColors = {};
  const cats = Data.allCatsByCount;
  cats.forEach((cat, i) => {
    const t = cats.length === 1 ? 1 : i / (cats.length - 1);
    catColors[cat] = rainbow(1 - t); // index 0 = most members = purple
  });

  const PERSON_GREY = '#8a8898';

  return { catColors, PERSON_GREY };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  GRAPH — nodes, edges, layout (force sim), camera                           ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Graph = (() => {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cv  = document.getElementById('graph');
  const ctx = cv.getContext('2d');
  let W, H;

  // Build nodes
  const nodes = [];
  Data.allCatsByCount.forEach(cat => nodes.push({
    id: 'cat:' + cat, type: 'interest', label: cat,
    color: Colors.catColors[cat],
    members: Data.cats[cat],
    radius: 22 + Data.cats[cat].length * 4.2,
    x: 0, y: 0, vx: 0, vy: 0,
  }));
  Data.allPeople.forEach(name => nodes.push({
    id: 'person:' + name, type: 'person', label: name,
    color: Colors.PERSON_GREY,
    cats: Data.personCats[name] || [],
    radius: 22,
    x: 0, y: 0, vx: 0, vy: 0,
  }));

  // Build edges
  const edges = [];
  for (const [cat, people] of Object.entries(Data.cats))
    for (const p of people) edges.push({ a: 'person:' + p, b: 'cat:' + cat });

  function getNode(id) { return nodes.find(n => n.id === id); }

  // Place interest nodes on outer ring, run force sim for people inside inner circle
  function placeNodes() {
    const outerR = Math.min(W, H) * 0.37;
    const innerR = Math.min(W, H) * 0.22;
    const catNodes    = nodes.filter(n => n.type === 'interest');
    const personNodes = nodes.filter(n => n.type === 'person');

    // Interests: evenly spaced on outer ring, order fixed by member count
    catNodes.forEach((n, i) => {
      const a = (i / catNodes.length) * Math.PI * 2 - Math.PI / 2;
      n.x = outerR * Math.cos(a);
      n.y = outerR * Math.sin(a);
      n.vx = 0; n.vy = 0;
    });

    // People: seed position toward weighted centroid of their interests
    const maxMembers = Math.max(...catNodes.map(c => c.members.length));
    personNodes.forEach(n => {
      const connected = (n.cats || []).map(c => getNode('cat:' + c)).filter(Boolean);
      if (connected.length) {
        let wX = 0, wY = 0, wSum = 0;
        for (const cn of connected) {
          const w = maxMembers / cn.members.length; // rare interests weigh more
          wX += cn.x * w; wY += cn.y * w; wSum += w;
        }
        const sx = wX / wSum, sy = wY / wSum;
        const d = Math.sqrt(sx * sx + sy * sy) || 1;
        n.x = (sx / d) * (innerR * 0.5);
        n.y = (sy / d) * (innerR * 0.5);
      } else {
        n.x = (Math.random() - 0.5) * 20;
        n.y = (Math.random() - 0.5) * 20;
      }
      n.vx = 0; n.vy = 0;
    });

    // Force sim: weighted attraction toward interests, repulsion between people, hard clamp
    const maxR = innerR - 24;
    for (let step = 0; step < 400; step++) {
      const cool = 1 - step / 400;
      for (const n of personNodes) {
        let fx = 0, fy = 0;

        // Weighted pull toward rare connected interests
        const connected = (n.cats || []).map(c => getNode('cat:' + c)).filter(Boolean);
        if (connected.length) {
          let wX = 0, wY = 0, wSum = 0;
          for (const cn of connected) {
            const w = maxMembers / cn.members.length;
            wX += cn.x * w; wY += cn.y * w; wSum += w;
          }
          const sx = wX / wSum, sy = wY / wSum;
          const d = Math.sqrt(sx * sx + sy * sy) || 1;
          const tx = (sx / d) * maxR * 0.55;
          const ty = (sy / d) * maxR * 0.55;
          fx += (tx - n.x) * 0.04;
          fy += (ty - n.y) * 0.04;
        }

        // Repulsion between people
        for (const m of personNodes) {
          if (m === n) continue;
          const dx = n.x - m.x, dy = n.y - m.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const minD = n.radius + m.radius + 8;
          if (dist < minD) {
            fx += (dx / dist) * (minD - dist) * 0.5;
            fy += (dy / dist) * (minD - dist) * 0.5;
          }
        }

        n.vx = (n.vx + fx) * 0.45 * cool;
        n.vy = (n.vy + fy) * 0.45 * cool;
        n.x += n.vx;
        n.y += n.vy;

        // Hard clamp inside inner circle
        const d = Math.sqrt(n.x * n.x + n.y * n.y) || 1;
        if (d > maxR) { n.x = (n.x / d) * maxR; n.y = (n.y / d) * maxR; n.vx *= 0.2; n.vy *= 0.2; }
      }
    }
  }

  function resize() {
    const rect = cv.parentElement.getBoundingClientRect();
    W = rect.width; H = rect.height;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(DPR, DPR);
    placeNodes();
    Renderer.draw();
  }

  return { cv, ctx, nodes, edges, getNode, resize, get W() { return W; }, get H() { return H; }, DPR };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  CAMERA — pan and zoom                                                      ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Camera = (() => {
  let cam = { x: 0, y: 0, scale: 1 };

  function wts(x, y) {
    return { x: (x + cam.x) * cam.scale + Graph.W / 2, y: (y + cam.y) * cam.scale + Graph.H / 2 };
  }
  function stw(sx, sy) {
    return { x: (sx - Graph.W / 2) / cam.scale - cam.x, y: (sy - Graph.H / 2) / cam.scale - cam.y };
  }
  function reset() { cam = { x: 0, y: 0, scale: 1 }; }
  function zoom(factor, sx, sy) {
    const before = stw(sx, sy);
    cam.scale = Math.max(0.3, Math.min(3.5, cam.scale * factor));
    const after = stw(sx, sy);
    cam.x += after.x - before.x;
    cam.y += after.y - before.y;
  }
  function pan(dx, dy) { cam.x += dx / cam.scale; cam.y += dy / cam.scale; }
  return { wts, stw, reset, zoom, pan, get scale() { return cam.scale; } };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  STATE — selection, highlighting, overlap                                   ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const State = (() => {
  const selPeople = new Set();
  const selCats   = new Set();

  function sharedInterests() {
    if (selPeople.size === 0) return new Set();
    const arr = [...selPeople];
    let shared = new Set(Data.personCats[arr[0]] || []);
    for (let i = 1; i < arr.length; i++) {
      const pc = new Set(Data.personCats[arr[i]] || []);
      for (const c of [...shared]) if (!pc.has(c)) shared.delete(c);
    }
    return shared;
  }

  function sharedPeople() {
    if (selCats.size === 0) return new Set();
    const arr = [...selCats];
    let shared = new Set(Data.cats[arr[0]] || []);
    for (let i = 1; i < arr.length; i++) {
      const pc = new Set(Data.cats[arr[i]] || []);
      for (const p of [...shared]) if (!pc.has(p)) shared.delete(p);
    }
    return shared;
  }

  function isHighlighted(node) {
    if (selPeople.size === 0 && selCats.size === 0) return true;
    if (selPeople.size > 0) {
      const sh = sharedInterests();
      return node.type === 'person' ? selPeople.has(node.label) : sh.has(node.label);
    }
    if (selCats.size > 0) {
      const sp = sharedPeople();
      return node.type === 'interest' ? selCats.has(node.label) : sp.has(node.label);
    }
    return true;
  }

  // Fraction of personA's interests that personB also has
  function overlapRatio(nameA, nameB) {
    const a = new Set(Data.personCats[nameA] || []);
    const b = new Set(Data.personCats[nameB] || []);
    if (a.size === 0) return 0;
    let shared = 0;
    for (const c of a) if (b.has(c)) shared++;
    return shared / a.size;
  }

  // When one person selected: normalised overlap map (best match = 1.0)
  function overlapMap() {
    if (selPeople.size !== 1) return null;
    const pivot = [...selPeople][0];
    const map = {};
    let maxR = 0;
    for (const n of Graph.nodes) {
      if (n.type === 'person' && !selPeople.has(n.label)) {
        const r = overlapRatio(pivot, n.label);
        map[n.label] = r;
        if (r > maxR) maxR = r;
      }
    }
    if (maxR > 0) for (const k in map) map[k] /= maxR;
    return map;
  }

  function togglePerson(name) {
    selCats.clear();
    selPeople.has(name) ? selPeople.delete(name) : selPeople.add(name);
  }

  function toggleCat(cat) {
    selPeople.clear();
    selCats.has(cat) ? selCats.delete(cat) : selCats.add(cat);
  }

  function clearAll() { selPeople.clear(); selCats.clear(); }

  function anyFilter()  { return selPeople.size > 0 || selCats.size > 0; }
  function onePerson()  { return selPeople.size === 1 ? [...selPeople][0] : null; }
  function isEdgeHL(e)  { return isHighlighted(Graph.getNode(e.a)) && isHighlighted(Graph.getNode(e.b)); }

  return {
    selPeople, selCats,
    sharedInterests, sharedPeople,
    isHighlighted, isEdgeHL,
    overlapMap, overlapRatio,
    togglePerson, toggleCat, clearAll,
    anyFilter, onePerson,
  };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  RENDERER — draws everything onto the canvas                                ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Renderer = (() => {
  const { ctx } = Graph;

  function ha(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function drawBackground() {
    const op = Camera.wts(0, 0);
    const outerR = Math.min(Graph.W, Graph.H) * 0.37 * Camera.scale;
    const innerR = Math.min(Graph.W, Graph.H) * 0.22 * Camera.scale;
    ctx.save();
    // Outer dashed ring
    ctx.beginPath(); ctx.arc(op.x, op.y, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.setLineDash([5, 7]); ctx.stroke(); ctx.setLineDash([]);
    // Inner filled circle with border
    ctx.beginPath(); ctx.arc(op.x, op.y, innerR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(20,18,36,0.72)'; ctx.fill();
    ctx.beginPath(); ctx.arc(op.x, op.y, innerR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(138,136,152,0.22)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }

  function drawEdges() {
    const af = State.anyFilter();
    for (const e of Graph.edges) {
      const a = Graph.getNode(e.a), b = Graph.getNode(e.b);
      if (!a || !b) continue;
      const pa = Camera.wts(a.x, a.y), pb = Camera.wts(b.x, b.y);
      const active = State.isEdgeHL(e);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
      if (active) {
        const cat = a.type === 'interest' ? a : b;
        ctx.strokeStyle = ha(cat.color, 0.5); ctx.lineWidth = 1.5; ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = af ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.065)';
        ctx.lineWidth = 0.8; ctx.setLineDash([3, 5]);
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
  }

  function nodeAlpha(node, isSel, oMap) {
    const af = State.anyFilter();
    const active = State.isHighlighted(node);
    const pivot = State.onePerson();
    if (!af) return 0.75;
    if (pivot && node.type === 'person' && !isSel) {
      // oMap values are already normalised 0–1 where 1.0 = best match
      // best match → exactly 0.85, zero match → 0.08
      const ratio = oMap ? (oMap[node.label] ?? 0) : 0;
      return 0.08 + ratio * 1//(0.85 - 0.08);
    }
    return active ? 1 : 0.38;
  }

  function drawInterestNode(node, isSel, isHov, alpha) {
    const p = Camera.wts(node.x, node.y);
    const r = node.radius * Camera.scale;
    const color = node.color;
    const active = State.isHighlighted(node);

    if (active) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 8, 0, Math.PI * 2);
      ctx.fillStyle = ha(color, 0.07); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = ha(color, active ? 0.15 : 0.06); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = ha(color, active ? 0.9 : 0.3);
    ctx.lineWidth = isSel ? 2.5 : (isHov ? 2 : 1.5); ctx.stroke();
    if (isSel || isHov) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = ha(color, 0.45); ctx.lineWidth = 1; ctx.stroke();
    }

    ctx.save(); ctx.globalAlpha = alpha;
    const fs = Math.max(8, Math.min(12, r * 0.32));
    ctx.font = `600 ${fs}px 'Cinzel',serif`;
    ctx.fillStyle = active ? '#e8e4f0' : '#7a7490';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const words = node.label.split(' ');
    if (words.length > 1 && r > 26) {
      const mid = Math.ceil(words.length / 2);
      ctx.fillText(words.slice(0, mid).join(' '), p.x, p.y - fs * 0.6);
      ctx.fillText(words.slice(mid).join(' '), p.x, p.y + fs * 0.6);
    } else {
      ctx.fillText(node.label, p.x, p.y);
    }
    if (active && r > 26) {
      ctx.font = `400 ${Math.max(7, fs - 3)}px 'Raleway',sans-serif`;
      ctx.fillStyle = ha(color, 0.7);
      ctx.fillText(node.members.length + ' people', p.x, p.y + fs * 1.6);
    }
    ctx.restore();
  }

  function drawPersonNode(node, isSel, isHov, alpha) {
    const p = Camera.wts(node.x, node.y);
    const r = node.radius * Camera.scale;
    const active = State.isHighlighted(node);

    ctx.save(); ctx.globalAlpha = alpha;
    if (isSel) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(138,136,152,0.12)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? (isSel ? 'rgba(138,136,152,0.25)' : 'rgba(138,136,152,0.12)') : 'rgba(138,136,152,0.05)';
    ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = active ? (isSel ? 'rgba(200,198,210,0.9)' : 'rgba(138,136,152,0.75)') : 'rgba(138,136,152,0.3)';
    ctx.lineWidth = isSel ? 2.5 : (isHov ? 2 : 1.5);
    ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
    if (isHov || isSel) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200,198,210,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    }
    const fs = Math.max(8, Math.min(11, r * 0.46));
    ctx.font = `500 ${fs}px 'Raleway',sans-serif`;
    ctx.fillStyle = active ? '#c8c6d2' : '#5a5868';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(node.label, p.x, p.y);
    ctx.restore();
  }

  function drawNodes() {
    const oMap = State.overlapMap();
    for (const node of Graph.nodes) {
      const isHov = Interaction.hovNode && Interaction.hovNode.id === node.id;
      const isSel = node.type === 'person' ? State.selPeople.has(node.label) : State.selCats.has(node.label);
      const alpha = nodeAlpha(node, isSel, oMap);
      if (node.type === 'interest') drawInterestNode(node, isSel, isHov, alpha);
      else drawPersonNode(node, isSel, isHov, alpha);
    }
  }

  function updateMultibar() {
    const bar = document.getElementById('multibar');
    const sp = State.selPeople, sc = State.selCats;
    if (sp.size >= 2) {
      const sh = State.sharedInterests();
      bar.textContent = [...sp].sort().join(' + ') + '  ·  ' + sh.size + ' shared interest' + (sh.size !== 1 ? 's' : '');
      bar.style.display = 'block';
    } else if (sp.size === 1) {
      const nm = [...sp][0];
      bar.textContent = nm + '  ·  ' + (Data.personCats[nm] || []).length + ' interests  ·  select more to find overlap';
      bar.style.display = 'block';
    } else if (sc.size >= 2) {
      const shp = State.sharedPeople();
      bar.textContent = [...sc].join(' + ') + '  ·  ' + shp.size + ' ' + (shp.size !== 1 ? 'people' : 'person') + ' in common';
      bar.style.display = 'block';
    } else if (sc.size === 1) {
      const cat = [...sc][0];
      bar.textContent = cat + '  ·  ' + Data.cats[cat].length + ' people  ·  select more interests to find overlap';
      bar.style.display = 'block';
    } else {
      bar.style.display = 'none';
    }
  }

  function draw() {
    ctx.clearRect(0, 0, Graph.W, Graph.H);
    drawBackground();
    drawEdges();
    drawNodes();
    updateMultibar();
  }

  return { draw, ha };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  SIDEBAR — builds the people and interest chip lists                        ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Sidebar = (() => {
  function build() {
    const pl = document.getElementById('person-list');
    for (const name of Data.allPeople) {
      const d = document.createElement('div');
      d.className = 'chip'; d.dataset.name = name;
      d.innerHTML = `<span class="chip-dot" style="background:#8a8898"></span>${name}<span class="chip-count">${(Data.personCats[name] || []).length}</span>`;
      d.onclick = () => { State.togglePerson(name); sync(); Renderer.draw(); };
      pl.appendChild(d);
    }
    const il = document.getElementById('interest-list');
    for (const cat of Data.allCatsAlpha) {
      const d = document.createElement('div');
      d.className = 'chip'; d.dataset.cat = cat;
      d.innerHTML = `<span class="chip-dot" style="background:${Colors.catColors[cat]}"></span>${cat}<span class="chip-count">${Data.cats[cat].length}</span>`;
      d.onclick = () => { State.toggleCat(cat); sync(); Renderer.draw(); };
      il.appendChild(d);
    }
  }

  function sync() {
    document.querySelectorAll('.chip[data-name]').forEach(c => c.classList.toggle('active', State.selPeople.has(c.dataset.name)));
    document.querySelectorAll('.chip[data-cat]').forEach(c  => c.classList.toggle('active', State.selCats.has(c.dataset.cat)));
  }

  return { build, sync };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  INTERACTION — mouse/wheel events, hit testing, tooltip                     ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const Interaction = (() => {
  let hovNode = null;
  let dragging = false, dragMoved = false;
  let dragStart = { x: 0, y: 0 }, camStart = { x: 0, y: 0 };
  let _camX = 0, _camY = 0; // snapshot of cam at drag start

  function getHit(sx, sy) {
    const w = Camera.stw(sx, sy);
    for (let i = Graph.nodes.length - 1; i >= 0; i--) {
      const n = Graph.nodes[i], dx = w.x - n.x, dy = w.y - n.y;
      if (Math.sqrt(dx * dx + dy * dy) < n.radius) return n;
    }
    return null;
  }

  function showTooltip(node, sx, sy) {
    const tip = document.getElementById('tooltip');
    let html = `<div class="tip-title">${node.label}</div>`;
    if (node.type === 'interest') {
      html += node.members.map(p => `<div class="tip-item"><span class="tip-dot" style="background:#8a8898"></span>${p}</div>`).join('');
    } else {
      html += (node.cats || []).map(c => `<div class="tip-item"><span class="tip-dot" style="background:${Colors.catColors[c] || '#888'}"></span>${c}</div>`).join('');
    }
    tip.innerHTML = html;
    tip.style.left = Math.min(sx + 14, Graph.W - 235) + 'px';
    tip.style.top  = Math.max(sy - 10, 10) + 'px';
    tip.style.display = 'block';
  }

  function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

  const cv = Graph.cv;

  cv.addEventListener('mousedown', e => {
    dragging = true; dragMoved = false;
    cv.classList.add('dragging');
    dragStart = { x: e.clientX, y: e.clientY };
    // Store current cam values via a pan(0,0) call trick — just record start
    _camX = e.clientX; _camY = e.clientY;
  });

  cv.addEventListener('mousemove', e => {
    const rect = cv.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (dragging) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
      Camera.pan(e.clientX - _camX, e.clientY - _camY);
      _camX = e.clientX; _camY = e.clientY;
      Renderer.draw(); return;
    }
    hovNode = getHit(sx, sy);
    cv.style.cursor = hovNode ? 'pointer' : 'grab';
    if (hovNode) showTooltip(hovNode, sx, sy); else hideTooltip();
    Renderer.draw();
  });

  cv.addEventListener('mouseup', e => {
    const wasDrag = dragMoved;
    dragging = false; dragMoved = false;
    cv.classList.remove('dragging');
    if (!wasDrag) {
      const rect = cv.getBoundingClientRect();
      const hit = getHit(e.clientX - rect.left, e.clientY - rect.top);
      if (hit) {
        if (hit.type === 'person') State.togglePerson(hit.label);
        else State.toggleCat(hit.label);
        Sidebar.sync();
      } else {
        State.clearAll(); Sidebar.sync();
      }
      Renderer.draw();
    }
  });

  cv.addEventListener('mouseleave', () => {
    dragging = false; hovNode = null; hideTooltip(); Renderer.draw();
  });

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    Camera.zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX - rect.left, e.clientY - rect.top);
    Renderer.draw();
  }, { passive: false });

  // ── Touch support ──
  let touches = {};
  let lastPinchDist = null;

  function touchPos(t, rect) {
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    touches = {};
    for (const t of e.touches) touches[t.identifier] = touchPos(t, rect);
    lastPinchDist = null;
    dragMoved = false;
    if (e.touches.length === 1) {
      dragStart = touchPos(e.touches[0], rect);
      _camX = e.touches[0].clientX; _camY = e.touches[0].clientY;
    }
  }, { passive: false });

  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    if (e.touches.length === 2) {
      // Pinch-to-zoom
      const t0 = touchPos(e.touches[0], rect);
      const t1 = touchPos(e.touches[1], rect);
      const dist = Math.hypot(t1.x - t0.x, t1.y - t0.y);
      const cx = (t0.x + t1.x) / 2, cy = (t0.y + t1.y) / 2;
      if (lastPinchDist !== null) {
        Camera.zoom(dist / lastPinchDist, cx, cy);
        Renderer.draw();
      }
      lastPinchDist = dist;
      dragMoved = true;
    } else if (e.touches.length === 1) {
      // Pan
      const nx = e.touches[0].clientX, ny = e.touches[0].clientY;
      const dx = nx - _camX, dy = ny - _camY;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
      Camera.pan(dx, dy);
      _camX = nx; _camY = ny;
      Renderer.draw();
    }
  }, { passive: false });

  cv.addEventListener('touchend', e => {
    e.preventDefault();
    if (!dragMoved && e.changedTouches.length === 1) {
      const rect = cv.getBoundingClientRect();
      const pos = touchPos(e.changedTouches[0], rect);
      const hit = getHit(pos.x, pos.y);
      if (hit) {
        if (hit.type === 'person') State.togglePerson(hit.label);
        else State.toggleCat(hit.label);
        Sidebar.sync();
      } else {
        State.clearAll(); Sidebar.sync();
      }
      Renderer.draw();
    }
    lastPinchDist = null;
    dragMoved = false;
  }, { passive: false });

  return { get hovNode() { return hovNode; } };
})();

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  CONTROLS — reset button, download button                                   ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
document.getElementById('reset-btn').onclick = () => {
  Camera.reset(); State.clearAll(); Sidebar.sync(); Renderer.draw();
};

document.getElementById('download-btn').onclick = () => {
  const { nodes, W, H, DPR, cv } = Graph;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const node of nodes) {
    const p = Camera.wts(node.x, node.y);
    const r = node.radius * Camera.scale + 10;
    minX = Math.min(minX, p.x - r); minY = Math.min(minY, p.y - r);
    maxX = Math.max(maxX, p.x + r); maxY = Math.max(maxY, p.y + r);
  }
  const pad = 24;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(W, maxX + pad);  maxY = Math.min(H, maxY + pad);
  const cw = Math.ceil((maxX - minX) * DPR), ch = Math.ceil((maxY - minY) * DPR);
  const temp = document.createElement('canvas'); temp.width = cw; temp.height = ch;
  const tctx = temp.getContext('2d');
  tctx.fillStyle = '#0f0e17'; tctx.fillRect(0, 0, cw, ch);
  tctx.drawImage(cv, minX * DPR, minY * DPR, cw, ch, 0, 0, cw, ch);
  const link = document.createElement('a');
  link.download = 'friend-interest-map.png';
  link.href = temp.toDataURL('image/png'); link.click();
};

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  INIT                                                                       ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
window.addEventListener('resize', () => {
  Graph.ctx.setTransform(1, 0, 0, 1, 0, 0);
  Graph.resize();
});

Sidebar.build();
setTimeout(() => Graph.resize(), 50);
</script>
