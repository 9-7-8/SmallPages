<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Interest Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17; --bg2: #181625;
    --text: #e8e4f0; --text-dim: #7a7490;
    --accent: #c9a96e; --border: rgba(201,169,110,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.18) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 55%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 40%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.14) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.18) 0%, transparent 100%);
  }
  header {
    position: relative; z-index: 10; padding: 20px 30px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; }
  header p { font-size: 11px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0.04em; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  button { font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.07em; cursor: pointer; border-radius: 4px; transition: all 0.18s; padding: 6px 13px; text-transform: uppercase; }
  #download-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #download-btn:hover { background: rgba(201,169,110,0.1); }
  #reset-btn { background: transparent; color: var(--text-dim); border: 1px solid rgba(122,116,144,0.35); }
  #reset-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .layout { position: relative; z-index: 1; display: flex; height: calc(100vh - 78px); }

  .sidebar { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 14px 0; overflow-y: auto; background: rgba(15,14,23,0.75); }
  .sidebar-section { padding: 0 13px 13px; }
  .sidebar-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); font-weight: 500; margin-bottom: 7px; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 4px; cursor: pointer; transition: background 0.13s; margin-bottom: 2px; font-size: 12px; font-weight: 400; color: var(--text); border: 1px solid transparent; user-select: none; }
  .chip:hover { background: rgba(255,255,255,0.05); }
  .chip.active-person { background: rgba(201,169,110,0.1); border-color: rgba(201,169,110,0.35); }
  .chip.active-cat { background: rgba(139,127,212,0.1); border-color: rgba(139,127,212,0.35); }
  .chip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; opacity: 0.85; }
  .chip-count { margin-left: auto; font-size: 9px; color: var(--text-dim); background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 10px; }
  .divider { height: 1px; background: var(--border); margin: 10px 13px; }

  .graph-area { flex: 1; position: relative; overflow: hidden; }
  canvas#graph { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas#graph.dragging { cursor: grabbing; }

  #tooltip { position: absolute; pointer-events: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 13px; font-size: 12px; max-width: 210px; display: none; z-index: 100; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  #tooltip .tip-title { font-family: 'Cinzel', serif; font-size: 13px; color: var(--accent); margin-bottom: 5px; font-weight: 400; }
  #tooltip .tip-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: var(--text); font-weight: 300; }
  #tooltip .tip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .info-panel { width: 0; overflow: hidden; transition: width 0.28s ease; border-left: 1px solid transparent; background: rgba(15,14,23,0.75); }
  .info-panel.open { width: 210px; border-left-color: var(--border); overflow-y: auto; padding: 18px 14px; }
  .info-panel-title { font-family: 'Cinzel', serif; font-size: 15px; color: var(--accent); margin-bottom: 3px; }
  .info-panel-subtitle { font-size: 10px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }
  .info-member { display: flex; align-items: center; gap: 7px; padding: 5px 0; font-size: 12px; font-weight: 400; border-bottom: 1px solid rgba(255,255,255,0.04); }

  #multibar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(20,18,35,0.94); border: 1px solid var(--border); border-radius: 20px; padding: 5px 16px; font-size: 11px; color: var(--accent); display: none; z-index: 50; letter-spacing: 0.05em; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }

  #legend { position: absolute; bottom: 14px; left: 14px; font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em; }
  .leg-row { margin-top: 5px; display: flex; align-items: center; gap: 7px; }
  .leg-solid { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(201,169,110,0.5); background: rgba(201,169,110,0.08); }
  .leg-dashed { width: 12px; height: 12px; border-radius: 50%; border: 1.5px dashed rgba(139,127,212,0.7); background: rgba(139,127,212,0.06); }
  #hint { position: absolute; bottom: 14px; right: 14px; font-size: 10px; color: var(--text-dim); text-align: right; letter-spacing: 0.04em; line-height: 1.7; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Friend Interest Map</h1>
    <p>Select multiple people to find shared interests · Click an interest to see members</p>
  </div>
  <div class="header-actions">
    <button id="reset-btn">Reset</button>
    <button id="download-btn">⬇ Download View</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">People — multi-select for overlap</div>
      <div id="person-list"></div>
    </div>
    <div class="divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Interests</div>
      <div id="interest-list"></div>
    </div>
  </aside>

  <div class="graph-area">
    <canvas id="graph"></canvas>
    <div id="tooltip"></div>
    <div id="multibar"></div>
    <div id="legend">
      <div class="leg-row"><span class="leg-solid"></span> Interest (size = member count)</div>
      <div class="leg-row"><span class="leg-dashed"></span> Person</div>
    </div>
    <div id="hint">Scroll to zoom · Drag to pan<br>Click empty space to clear selection</div>
  </div>

  <aside class="info-panel" id="info-panel">
    <div class="info-panel-title" id="info-title"></div>
    <div class="info-panel-subtitle" id="info-sub"></div>
    <div id="info-members"></div>
  </aside>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const CATS = {
  'Resident Evil':    ['Meg','Alex','Troy'],
  'Movies':           ['Isabel','Sarina','Troy'],
  'Dead by Daylight': ['Isabel','Alex','Troy','Sarina','Meg','Tyler','Jessica'],
  'Lethal Company':   ['Daniel','Meg','Isabel'],
  'Drawing':          ['Meg','Daniel','Troy','Jessica'],
  'Music':            ['Dusan','Meg','Isabel'],
  'TTRPGs':           ['Dusan','Isabel','Tyler','Jessica'],
  'Painting':         ['Tyler','Jessica'],
  'Writing':          ['Meg','Isabel','Troy','Jessica'],
  'Reading':          ['Meg','Alex','Dusan'],
  'Horror Movies':    ['Isabel','Meg','Sarina'],
  'Gacha Games':      ['Tyler','Jessica','Alex','Daniel'],
  'MMOs':             ['Dusan','Tyler','Alex'],
  'Coding':           ['Connor','Meg','Alex','Daniel','Isabel','Cherry'],
  'Bird Watching':    ['Connor','Cherry','Isabel'],
};

const PERSON_COLORS = {
  Meg:'#c47ed4', Alex:'#6bbfa0', Troy:'#d4895a', Isabel:'#d46e8e',
  Sarina:'#6da8d4', Tyler:'#c9a843', Jessica:'#d46a6a', Daniel:'#7ab85a',
  Dusan:'#8878c4', Connor:'#5ec4d4', Cherry:'#e0916a',
};

const CAT_COLORS = {
  'Resident Evil':'#8b7fd4','Movies':'#5bbda0','Dead by Daylight':'#d46a6a',
  'Lethal Company':'#d4895a','Drawing':'#d46e8e','Music':'#6da8d4',
  'TTRPGs':'#c9a843','Painting':'#7ab85a','Writing':'#c47ed4',
  'Reading':'#5bbda0','Horror Movies':'#c07845','Gacha Games':'#8878c4',
  'MMOs':'#5ec4d4','Coding':'#c9a96e','Bird Watching':'#8ab87a',
};

const personCats = {};
for (const [cat, people] of Object.entries(CATS))
  for (const p of people) { if (!personCats[p]) personCats[p] = []; personCats[p].push(cat); }

const allPeople = Object.keys(PERSON_COLORS);
const allCats = Object.keys(CATS);

// ── CANVAS ────────────────────────────────────────────────────────────────────
const DPR = Math.min(window.devicePixelRatio||1, 2);
const cv = document.getElementById('graph');
const ctx = cv.getContext('2d');
let W, H;

// ── NODES & EDGES ─────────────────────────────────────────────────────────────
const nodes = [];
allCats.forEach(cat => nodes.push({ id:'cat:'+cat, type:'interest', label:cat, color:CAT_COLORS[cat], members:CATS[cat], radius:22+CATS[cat].length*4.2, x:0,y:0 }));
allPeople.forEach(name => nodes.push({ id:'person:'+name, type:'person', label:name, color:PERSON_COLORS[name], cats:personCats[name]||[], radius:22, x:0,y:0 }));

const edges = [];
for (const [cat,people] of Object.entries(CATS))
  for (const p of people) edges.push({a:'person:'+p, b:'cat:'+cat});

function getNode(id) { return nodes.find(n=>n.id===id); }

// ── LAYOUT ────────────────────────────────────────────────────────────────────
function placeNodes() {
  const outerR = Math.min(W,H)*0.37;
  const innerR = Math.min(W,H)*0.155;
  const catNodes = nodes.filter(n=>n.type==='interest');
  const personNodes = nodes.filter(n=>n.type==='person');
  catNodes.forEach((n,i) => {
    const a = (i/catNodes.length)*Math.PI*2 - Math.PI/2;
    n.x = outerR*Math.cos(a);
    n.y = outerR*Math.sin(a);
  });
  personNodes.forEach((n,i) => {
    const a = (i/personNodes.length)*Math.PI*2 - Math.PI/2;
    n.x = innerR*Math.cos(a);
    n.y = innerR*Math.sin(a);
  });
}

function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(DPR,DPR);
  placeNodes();
  draw();
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
let cam={x:0,y:0,scale:1};
let dragging=false, dragMoved=false, dragStart={x:0,y:0}, camStart={x:0,y:0};

function wts(x,y){return{x:(x+cam.x)*cam.scale+W/2,y:(y+cam.y)*cam.scale+H/2};}
function stw(sx,sy){return{x:(sx-W/2)/cam.scale-cam.x,y:(sy-H/2)/cam.scale-cam.y};}

// ── STATE ─────────────────────────────────────────────────────────────────────
const selPeople = new Set();
let selCat = null;
let hovNode = null;

function sharedInts() {
  if (selPeople.size===0) return null;
  const arr=[...selPeople];
  let shared = new Set(personCats[arr[0]]||[]);
  for (let i=1;i<arr.length;i++){
    const pc=new Set(personCats[arr[i]]||[]);
    for (const c of [...shared]) if(!pc.has(c)) shared.delete(c);
  }
  return shared;
}

function isHighlighted(node) {
  if (selCat) {
    if (node.type==='interest') return node.label===selCat;
    return (personCats[node.label]||[]).includes(selCat);
  }
  if (selPeople.size>0) {
    const sh=sharedInts();
    if (node.type==='person') return selPeople.has(node.label);
    return sh.has(node.label);
  }
  return true;
}
function isEdgeHL(e){return isHighlighted(getNode(e.a))&&isHighlighted(getNode(e.b));}
function anyFilter(){return selCat||selPeople.size>0;}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function ha(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function draw() {
  ctx.clearRect(0,0,W,H);
  const af=anyFilter();
  const op=wts(0,0);
  const outerR=Math.min(W,H)*0.37*cam.scale;
  const innerR=Math.min(W,H)*0.155*cam.scale;

  // Ring guides
  ctx.save();
  // Outer dashed ring
  ctx.beginPath(); ctx.arc(op.x,op.y,outerR,0,Math.PI*2);
  ctx.strokeStyle='rgba(201,169,110,0.1)'; ctx.lineWidth=1; ctx.setLineDash([5,7]); ctx.stroke(); ctx.setLineDash([]);
  // Inner dashed ring
  ctx.beginPath(); ctx.arc(op.x,op.y,innerR,0,Math.PI*2);
  ctx.strokeStyle='rgba(139,127,212,0.13)'; ctx.lineWidth=1; ctx.setLineDash([3,6]); ctx.stroke(); ctx.setLineDash([]);
  // Inner zone fill
  ctx.beginPath(); ctx.arc(op.x,op.y,innerR*1.5,0,Math.PI*2);
  ctx.fillStyle='rgba(139,127,212,0.025)'; ctx.fill();
  // Zone labels
  ctx.font=`300 10px 'Raleway',sans-serif`; ctx.textAlign='center';
  ctx.fillStyle='rgba(139,127,212,0.4)';
  ctx.fillText('PEOPLE', op.x, op.y - innerR - 9);
  ctx.fillStyle='rgba(201,169,110,0.35)';
  ctx.fillText('INTERESTS', op.x, op.y - outerR - 9);
  ctx.restore();

  // Edges
  for (const e of edges) {
    const a=getNode(e.a), b=getNode(e.b);
    if(!a||!b) continue;
    const pa=wts(a.x,a.y), pb=wts(b.x,b.y);
    const active=isEdgeHL(e);
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
    if (active) {
      const cat=a.type==='interest'?a:b;
      ctx.strokeStyle=ha(cat.color,0.48); ctx.lineWidth=1.5; ctx.setLineDash([]);
    } else {
      ctx.strokeStyle=af?'rgba(255,255,255,0.022)':'rgba(255,255,255,0.07)';
      ctx.lineWidth=0.8; ctx.setLineDash([3,5]);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Nodes
  for (const node of nodes) {
    const p=wts(node.x,node.y);
    const r=node.radius*cam.scale;
    const active=isHighlighted(node);
    const alpha=active?1:(af?0.12:0.76);
    const isHov=hovNode&&hovNode.id===node.id;
    const isSel=node.type==='person'?selPeople.has(node.label):selCat===node.label;

    if (node.type==='interest') {
      // Glow
      if(active){ctx.beginPath();ctx.arc(p.x,p.y,r+7,0,Math.PI*2);ctx.fillStyle=ha(node.color,0.06);ctx.fill();}
      // Fill
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=ha(node.color,active?0.13:0.03);ctx.fill();
      // Border (solid for interests)
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.strokeStyle=ha(node.color,active?0.82:0.16);
      ctx.lineWidth=isSel?2.5:(isHov?2:1.5);ctx.stroke();
      if(isSel||isHov){ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.strokeStyle=ha(node.color,0.38);ctx.lineWidth=1;ctx.stroke();}
      // Label
      ctx.save();ctx.globalAlpha=alpha;
      const fs=Math.max(8,Math.min(12,r*0.32));
      ctx.font=`600 ${fs}px 'Cinzel',serif`;
      ctx.fillStyle=active?'#e8e4f0':'#3e3b55';
      ctx.textAlign='center';ctx.textBaseline='middle';
      const words=node.label.split(' ');
      if(words.length>1&&r>26){
        const mid=Math.ceil(words.length/2);
        ctx.fillText(words.slice(0,mid).join(' '),p.x,p.y-fs*0.6);
        ctx.fillText(words.slice(mid).join(' '),p.x,p.y+fs*0.6);
      } else { ctx.fillText(node.label,p.x,p.y); }
      if(active&&r>26){
        ctx.font=`400 ${Math.max(7,fs-3)}px 'Raleway',sans-serif`;
        ctx.fillStyle=ha(node.color,0.68);
        ctx.fillText(node.members.length+' people',p.x,p.y+fs*1.6);
      }
      ctx.restore();
    } else {
      // Person node (dashed border)
      ctx.save();ctx.globalAlpha=alpha;
      if(isSel){ctx.beginPath();ctx.arc(p.x,p.y,r+8,0,Math.PI*2);ctx.fillStyle=ha(node.color,0.1);ctx.fill();}
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=ha(node.color,active?(isSel?0.28:0.14):0.04);ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.strokeStyle=ha(node.color,active?0.88:0.18);
      ctx.lineWidth=isSel?2.5:(isHov?2:1.5);ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
      if(isHov||isSel){ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.strokeStyle=ha(node.color,0.32);ctx.lineWidth=1;ctx.stroke();}
      const fs=Math.max(8,Math.min(11,r*0.46));
      ctx.font=`500 ${fs}px 'Raleway',sans-serif`;
      ctx.fillStyle=active?'#e8e4f0':'#35324a';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(node.label,p.x,p.y);
      ctx.restore();
    }
  }

  // Multibar
  const bar=document.getElementById('multibar');
  if(selPeople.size>=2){
    const sh=sharedInts();
    bar.textContent=[...selPeople].join(' + ')+'  ·  '+sh.size+' shared interest'+(sh.size!==1?'s':'');
    bar.style.display='block';
  } else if(selPeople.size===1){
    const nm=[...selPeople][0];
    bar.textContent=nm+'  ·  '+(personCats[nm]||[]).length+' interests  ·  select more people to find overlap';
    bar.style.display='block';
  } else { bar.style.display='none'; }
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const pl=document.getElementById('person-list');
  for(const name of allPeople){
    const d=document.createElement('div');d.className='chip';d.dataset.name=name;
    d.innerHTML=`<span class="chip-dot" style="background:${PERSON_COLORS[name]}"></span>${name}<span class="chip-count">${(personCats[name]||[]).length}</span>`;
    d.onclick=()=>togglePerson(name);pl.appendChild(d);
  }
  const il=document.getElementById('interest-list');
  for(const cat of allCats){
    const d=document.createElement('div');d.className='chip';d.dataset.cat=cat;
    d.innerHTML=`<span class="chip-dot" style="background:${CAT_COLORS[cat]}"></span>${cat}<span class="chip-count">${CATS[cat].length}</span>`;
    d.onclick=()=>toggleCat(cat);il.appendChild(d);
  }
}

function syncChips(){
  document.querySelectorAll('.chip[data-name]').forEach(c=>c.classList.toggle('active-person',selPeople.has(c.dataset.name)));
  document.querySelectorAll('.chip[data-cat]').forEach(c=>c.classList.toggle('active-cat',selCat===c.dataset.cat));
}

function togglePerson(name){
  if(selCat){selCat=null;}
  selPeople.has(name)?selPeople.delete(name):selPeople.add(name);
  syncChips();updateInfoPanel();draw();
}

function toggleCat(cat){
  selPeople.clear();
  selCat=selCat===cat?null:cat;
  syncChips();
  if(selCat) showInfoPanel('interest',selCat); else closeInfoPanel();
  draw();
}

function updateInfoPanel(){
  if(selPeople.size===0){closeInfoPanel();return;}
  const panel=document.getElementById('info-panel');
  panel.classList.add('open');
  const title=document.getElementById('info-title');
  const sub=document.getElementById('info-sub');
  const membersEl=document.getElementById('info-members');
  if(selPeople.size===1){
    const name=[...selPeople][0];
    title.textContent=name;
    sub.textContent=(personCats[name]||[]).length+' interests';
    membersEl.innerHTML=(personCats[name]||[]).map(c=>`<div class="info-member"><span class="chip-dot" style="background:${CAT_COLORS[c]}"></span>${c}</div>`).join('');
  } else {
    const sh=sharedInts();
    title.textContent='Shared interests';
    sub.textContent=[...selPeople].join(', ');
    membersEl.innerHTML=sh.size===0
      ?`<div style="color:var(--text-dim);font-size:12px;padding:8px 0">No interests in common</div>`
      :[...sh].map(c=>`<div class="info-member"><span class="chip-dot" style="background:${CAT_COLORS[c]}"></span>${c}</div>`).join('');
  }
}

function showInfoPanel(type,id){
  const panel=document.getElementById('info-panel');panel.classList.add('open');
  document.getElementById('info-title').textContent=id;
  document.getElementById('info-sub').textContent=CATS[id].length+' people share this interest';
  document.getElementById('info-members').innerHTML=CATS[id].map(p=>`<div class="info-member"><span class="chip-dot" style="background:${PERSON_COLORS[p]||'#888'}"></span>${p}</div>`).join('');
}
function closeInfoPanel(){document.getElementById('info-panel').classList.remove('open');}

// ── EVENTS ────────────────────────────────────────────────────────────────────
function getHit(sx,sy){
  const w=stw(sx,sy);
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i],dx=w.x-n.x,dy=w.y-n.y;
    if(Math.sqrt(dx*dx+dy*dy)<n.radius) return n;
  }
  return null;
}

cv.addEventListener('mousedown',e=>{dragging=true;dragMoved=false;cv.classList.add('dragging');dragStart={x:e.clientX,y:e.clientY};camStart={x:cam.x,y:cam.y};});

cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  if(dragging){
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    if(Math.abs(dx)+Math.abs(dy)>3) dragMoved=true;
    cam.x=camStart.x+dx/cam.scale;cam.y=camStart.y+dy/cam.scale;draw();return;
  }
  hovNode=getHit(sx,sy);cv.style.cursor=hovNode?'pointer':'grab';
  const tip=document.getElementById('tooltip');
  if(hovNode){
    tip.style.display='block';
    let html=`<div class="tip-title">${hovNode.label}</div>`;
    if(hovNode.type==='interest'){html+=hovNode.members.map(p=>`<div class="tip-item"><span class="tip-dot" style="background:${PERSON_COLORS[p]||'#888'}"></span>${p}</div>`).join('');}
    else{html+=(hovNode.cats||[]).map(c=>`<div class="tip-item"><span class="tip-dot" style="background:${CAT_COLORS[c]}"></span>${c}</div>`).join('');}
    tip.innerHTML=html;
    tip.style.left=Math.min(sx+14,W-225)+'px';tip.style.top=Math.max(sy-10,10)+'px';
  } else { tip.style.display='none'; }
  draw();
});

cv.addEventListener('mouseup',e=>{
  const wasDrag=dragMoved;dragging=false;dragMoved=false;cv.classList.remove('dragging');
  if(!wasDrag){
    const rect=cv.getBoundingClientRect();
    const hit=getHit(e.clientX-rect.left,e.clientY-rect.top);
    if(hit){
      if(hit.type==='person') togglePerson(hit.label);
      else toggleCat(hit.label);
    } else clearAll();
  }
});

cv.addEventListener('mouseleave',()=>{dragging=false;hovNode=null;document.getElementById('tooltip').style.display='none';draw();});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  const before=stw(sx,sy);
  cam.scale=Math.max(0.3,Math.min(3.5,cam.scale*(e.deltaY<0?1.1:0.9)));
  const after=stw(sx,sy);
  cam.x+=after.x-before.x;cam.y+=after.y-before.y;draw();
},{passive:false});

function clearAll(){selPeople.clear();selCat=null;syncChips();closeInfoPanel();draw();}

document.getElementById('reset-btn').onclick=()=>{cam={x:0,y:0,scale:1};clearAll();};

document.getElementById('download-btn').onclick=()=>{
  const temp=document.createElement('canvas');temp.width=cv.width;temp.height=cv.height;
  const tctx=temp.getContext('2d');tctx.fillStyle='#0f0e17';tctx.fillRect(0,0,temp.width,temp.height);
  tctx.drawImage(cv,0,0);
  const link=document.createElement('a');link.download='friend-interest-map.png';link.href=temp.toDataURL('image/png');link.click();
};

window.addEventListener('resize',()=>{ctx.setTransform(1,0,0,1,0,0);resize();});
buildSidebar();
setTimeout(()=>resize(),50);
</script>
</body>
