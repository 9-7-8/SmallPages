<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Interest Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17; --bg2: #181625;
    --text: #e8e4f0; --text-dim: #7a7490;
    --accent: #c9a96e; --border: rgba(201,169,110,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.12) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.18) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 55%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 40%, rgba(255,255,255,0.1) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.14) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.18) 0%, transparent 100%);
  }
  header {
    position: relative; z-index: 10; padding: 20px 30px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; }
  header p { font-size: 11px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0.04em; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  button { font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.07em; cursor: pointer; border-radius: 4px; transition: all 0.18s; padding: 6px 13px; text-transform: uppercase; }
  #download-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #download-btn:hover { background: rgba(201,169,110,0.1); }
  #reset-btn { background: transparent; color: var(--text-dim); border: 1px solid rgba(122,116,144,0.35); }
  #reset-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .layout { position: relative; z-index: 1; display: flex; height: calc(100vh - 78px); }

  .sidebar { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 14px 0; overflow-y: auto; background: rgba(15,14,23,0.75); }
  .sidebar-section { padding: 0 13px 13px; }
  .sidebar-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); font-weight: 500; margin-bottom: 7px; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 4px; cursor: pointer; transition: background 0.13s; margin-bottom: 2px; font-size: 12px; font-weight: 400; color: var(--text); border: 1px solid transparent; user-select: none; }
  .chip:hover { background: rgba(255,255,255,0.05); }
  .chip.active { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
  .chip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .chip-count { margin-left: auto; font-size: 9px; color: var(--text-dim); background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 10px; }
  .divider { height: 1px; background: var(--border); margin: 10px 13px; }

  .graph-area { flex: 1; position: relative; overflow: hidden; }
  canvas#graph { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas#graph.dragging { cursor: grabbing; }

  #tooltip { position: absolute; pointer-events: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 13px; font-size: 12px; max-width: 220px; display: none; z-index: 100; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  #tooltip .tip-title { font-family: 'Cinzel', serif; font-size: 13px; color: var(--accent); margin-bottom: 5px; font-weight: 400; }
  #tooltip .tip-item { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; color: var(--text); font-weight: 300; }
  #tooltip .tip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  #multibar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(20,18,35,0.94); border: 1px solid var(--border); border-radius: 20px; padding: 5px 16px; font-size: 11px; color: var(--accent); display: none; z-index: 50; letter-spacing: 0.05em; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }

  #legend { position: absolute; bottom: 14px; left: 14px; font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em; }
  .leg-row { margin-top: 5px; display: flex; align-items: center; gap: 7px; }
  .leg-rainbow { width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(to right, #e84040, #e8a040, #e8e040, #40e860, #40c8e8, #4060e8, #9040e8); }
  .leg-solid { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); }
  .leg-dashed { width: 12px; height: 12px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,0.3); }
  #hint { position: absolute; bottom: 14px; right: 14px; font-size: 10px; color: var(--text-dim); text-align: right; letter-spacing: 0.04em; line-height: 1.7; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Friend Interest Map</h1>
    <p>Select multiple people or interests to find overlap · Click empty space to clear</p>
  </div>
  <div class="header-actions">
    <button id="reset-btn">Reset</button>
    <button id="download-btn">⬇ Download View</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">People</div>
      <div id="person-list"></div>
    </div>
    <div class="divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Interests — most people → purple</div>
      <div id="interest-list"></div>
    </div>
  </aside>

  <div class="graph-area">
    <canvas id="graph"></canvas>
    <div id="tooltip"></div>
    <div id="multibar"></div>
    <div id="legend">
      <div class="leg-row"><span class="leg-rainbow"></span> <span>interests: red = fewest · purple = most</span></div>
      <div class="leg-row" style="margin-top:8px"><span class="leg-solid"></span> Interest</div>
      <div class="leg-row"><span class="leg-dashed" style="border-color:rgba(138,136,152,0.6)"></span> Person</div>
    </div>
    <div id="hint">Scroll to zoom · Drag to pan<br>Click empty space to clear</div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const CATS = {
  'Resident Evil':       ['Meg','Alex','Troy','Tyler'],
  'Movies':              ['Isabel','Sarina','Troy','Frankie','Dusan'],
  'Dead by Daylight':    ['Isabel','Alex','Troy','Sarina','Meg','Tyler','Jessica'],
  'Lethal Company':      ['Daniel','Meg','Isabel'],
  'Drawing':             ['Meg','Daniel','Troy','Jessica'],
  'Music':               ['Dusan','Meg','Isabel','Adam'],
  'TTRPGs':              ['Dusan','Isabel','Tyler','Jessica'],
  'Painting':            ['Tyler','Jessica'],
  'Writing':             ['Meg','Isabel','Troy','Jessica','Tyler'],
  'Reading':             ['Meg','Alex','Dusan','Tyler','Jessica'],
  'Horror Movies':       ['Isabel','Meg','Sarina'],
  'Gacha Games':         ['Tyler','Jessica','Alex','Daniel'],
  'MMOs':                ['Dusan','Tyler','Alex'],
  'Coding':              ['Connor','Meg','Alex','Daniel','Isabel','Cherry'],
  'Bird Watching':       ['Connor','Cherry','Isabel'],
  'Singing / Instrument':['Jessica','Dusan'],
  'Owns A Cat':          ['Meg','Connor'],
  'Owns A Dog':          ['Isabel','Dusan','Alex','Jessica'],
};

// Build reverse map
const personCats = {};
for (const [cat, people] of Object.entries(CATS))
  for (const p of people) { if (!personCats[p]) personCats[p]=[]; personCats[p].push(cat); }

// All people derived from data (alphabetical)
const allPeopleRaw = [...new Set(Object.values(CATS).flat())].sort();
// Interests sorted by member count descending (for color ranking), alpha for sidebar
const allCats = Object.keys(CATS).sort((a,b) => CATS[b].length - CATS[a].length);
const allCatsAlpha = [...allCats].sort();
// People sorted by interest count descending (for rainbow ranking), then alpha for sidebar
const allPeopleSorted = [...allPeopleRaw].sort((a,b) => (personCats[b]||[]).length - (personCats[a]||[]).length);

// ── RAINBOW COLOR ─────────────────────────────────────────────────────────────
// t=0 → red, t=1 → purple, through rainbow: red→orange→yellow→green→cyan→blue→purple
function rainbowColor(t) {
  // hue: 0 (red) at t=0, up to 270 (purple) at t=1
  const hue = t * 270;
  // full saturation, lightness 58% for a vivid but not harsh tone on dark bg
  return hslToHex(hue, 85, 58);
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(x*255).toString(16).padStart(2,'0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

// Assign colors by rank
const catColorMap = {};
allCats.forEach((cat, i) => {
  const t = allCats.length === 1 ? 1 : i / (allCats.length - 1);
  // allCats[0] has most members → purple (t=1), last has fewest → red (t=0)
  catColorMap[cat] = rainbowColor(1 - t);
});

const personColorMap = {};
allPeopleSorted.forEach((name, i) => {
  const t = allPeopleSorted.length === 1 ? 1 : i / (allPeopleSorted.length - 1);
  personColorMap[name] = rainbowColor(1 - t);
});

// ── CANVAS ────────────────────────────────────────────────────────────────────
const DPR = Math.min(window.devicePixelRatio||1, 2);
const cv = document.getElementById('graph');
const ctx = cv.getContext('2d');
let W, H;

// ── NODES & EDGES ─────────────────────────────────────────────────────────────
const nodes = [];
allCats.forEach(cat => nodes.push({
  id:'cat:'+cat, type:'interest', label:cat,
  color: catColorMap[cat],
  members: CATS[cat],
  radius: 22 + CATS[cat].length * 4.2,
  x:0, y:0
}));
allPeopleRaw.forEach(name => nodes.push({
  id:'person:'+name, type:'person', label:name,
  color: personColorMap[name],
  cats: personCats[name]||[],
  radius: 22,
  x:0, y:0
}));

const edges = [];
for (const [cat,people] of Object.entries(CATS))
  for (const p of people) edges.push({a:'person:'+p, b:'cat:'+cat});

function getNode(id) { return nodes.find(n=>n.id===id); }

// ── LAYOUT ────────────────────────────────────────────────────────────────────
function placeNodes() {
  const outerR = Math.min(W,H)*0.37;
  const innerR = Math.min(W,H)*0.22; // center circle radius for people
  const catNodes = nodes.filter(n=>n.type==='interest');
  const personNodes = nodes.filter(n=>n.type==='person');

  // Interests: fixed on outer ring
  catNodes.forEach((n,i) => {
    const a = (i/catNodes.length)*Math.PI*2 - Math.PI/2;
    n.x = outerR*Math.cos(a);
    n.y = outerR*Math.sin(a);
    n.vx=0; n.vy=0; n.fixed=true;
  });

  // People: seed at weighted centroid of connected interest directions, scaled into inner circle
  personNodes.forEach(n => {
    const cats = (n.cats||[]).map(c=>getNode('cat:'+c)).filter(Boolean);
    if(cats.length){
      let sx=cats.reduce((s,c)=>s+c.x,0)/cats.length;
      let sy=cats.reduce((s,c)=>s+c.y,0)/cats.length;
      const d=Math.sqrt(sx*sx+sy*sy)||1;
      const seed = innerR * 0.5;
      n.x = (sx/d)*seed; n.y = (sy/d)*seed;
    } else { n.x=(Math.random()-0.5)*20; n.y=(Math.random()-0.5)*20; }
    n.vx=0; n.vy=0; n.fixed=false;
  });

  // Force sim: attract toward interest direction (weighted by rarity), repel each other, hard-clamp inside innerR
  const maxR = innerR - 24; // node radius ~22 so keep centres inside
  // Precompute per-interest weight: fewer members = stronger pull (inverse member count, normalised)
  const maxMembers = Math.max(...catNodes.map(c=>c.members.length));
  for(let step=0; step<400; step++){
    const cool = 1 - step/400;
    for(const n of personNodes){
      let fx=0, fy=0;
      // Weighted pull toward each connected interest direction
      const cats=(n.cats||[]).map(c=>getNode('cat:'+c)).filter(Boolean);
      if(cats.length){
        let wSumX=0, wSumY=0, wSum=0;
        for(const cn of cats){
          // Weight = maxMembers / memberCount  →  rare interests pull more
          const w = maxMembers / cn.members.length;
          wSumX += cn.x * w;
          wSumY += cn.y * w;
          wSum += w;
        }
        const sx=wSumX/wSum, sy=wSumY/wSum;
        const d=Math.sqrt(sx*sx+sy*sy)||1;
        const tx=(sx/d)*maxR*0.55, ty=(sy/d)*maxR*0.55;
        fx += (tx-n.x)*0.04;
        fy += (ty-n.y)*0.04;
      }
      // Repulsion between people
      for(const m of personNodes){
        if(m===n) continue;
        const dx=n.x-m.x, dy=n.y-m.y;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const minD=n.radius+m.radius+8;
        if(dist<minD){
          fx += (dx/dist)*(minD-dist)*0.5;
          fy += (dy/dist)*(minD-dist)*0.5;
        }
      }
      n.vx = (n.vx+fx)*0.45*cool;
      n.vy = (n.vy+fy)*0.45*cool;
      n.x += n.vx;
      n.y += n.vy;
      // Hard clamp inside circle
      const d=Math.sqrt(n.x*n.x+n.y*n.y)||1;
      if(d>maxR){ n.x=(n.x/d)*maxR; n.y=(n.y/d)*maxR; n.vx*=0.2; n.vy*=0.2; }
    }
  }
}

function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(DPR,DPR);
  placeNodes();
  draw();
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
let cam={x:0,y:0,scale:1};
let dragging=false, dragMoved=false, dragStart={x:0,y:0}, camStart={x:0,y:0};

function wts(x,y){return{x:(x+cam.x)*cam.scale+W/2,y:(y+cam.y)*cam.scale+H/2};}
function stw(sx,sy){return{x:(sx-W/2)/cam.scale-cam.x,y:(sy-H/2)/cam.scale-cam.y};}

// ── STATE ─────────────────────────────────────────────────────────────────────
const selPeople = new Set();
const selCats   = new Set();
let hovNode = null;

function sharedInts() {
  if (selPeople.size===0) return new Set();
  const arr=[...selPeople];
  let shared = new Set(personCats[arr[0]]||[]);
  for (let i=1;i<arr.length;i++){
    const pc=new Set(personCats[arr[i]]||[]);
    for (const c of [...shared]) if(!pc.has(c)) shared.delete(c);
  }
  return shared;
}

function sharedPeople() {
  if (selCats.size===0) return new Set();
  const arr=[...selCats];
  let shared = new Set(CATS[arr[0]]||[]);
  for (let i=1;i<arr.length;i++){
    const pc=new Set(CATS[arr[i]]||[]);
    for (const p of [...shared]) if(!pc.has(p)) shared.delete(p);
  }
  return shared;
}

function isHighlighted(node) {
  if (selPeople.size===0 && selCats.size===0) return true;
  if (selPeople.size>0) {
    const sh = sharedInts();
    if (node.type==='person') return selPeople.has(node.label);
    return sh.has(node.label);
  }
  if (selCats.size>0) {
    const sp = sharedPeople();
    if (node.type==='interest') return selCats.has(node.label);
    return sp.has(node.label);
  }
  return true;
}

// Returns 0..1: fraction of personA's interests that personB also has
function overlapRatio(nameA, nameB) {
  const a = new Set(personCats[nameA]||[]);
  const b = new Set(personCats[nameB]||[]);
  if (a.size===0) return 0;
  let shared=0;
  for (const c of a) if(b.has(c)) shared++;
  return shared/a.size;
}

function isEdgeHL(e){return isHighlighted(getNode(e.a))&&isHighlighted(getNode(e.b));}
function anyFilter(){return selPeople.size>0||selCats.size>0;}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function ha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

function draw() {
  ctx.clearRect(0,0,W,H);
  const af=anyFilter();
  const op=wts(0,0);
  const outerR=Math.min(W,H)*0.37*cam.scale;
  const innerR=Math.min(W,H)*0.22*cam.scale;

  // Outer ring guide
  ctx.save();
  ctx.beginPath(); ctx.arc(op.x,op.y,outerR,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1; ctx.setLineDash([5,7]); ctx.stroke(); ctx.setLineDash([]);

  // Inner circle — background for people
  ctx.beginPath(); ctx.arc(op.x,op.y,innerR,0,Math.PI*2);
  ctx.fillStyle='rgba(20,18,36,0.72)'; ctx.fill();
  ctx.beginPath(); ctx.arc(op.x,op.y,innerR,0,Math.PI*2);
  ctx.strokeStyle='rgba(138,136,152,0.22)'; ctx.lineWidth=1; ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // Edges
  for (const e of edges) {
    const a=getNode(e.a), b=getNode(e.b); if(!a||!b) continue;
    const pa=wts(a.x,a.y), pb=wts(b.x,b.y);
    const active=isEdgeHL(e);
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
    if (active) {
      // Color the edge by the interest node's color
      const cat=a.type==='interest'?a:b;
      ctx.strokeStyle=ha(cat.color,0.5); ctx.lineWidth=1.5; ctx.setLineDash([]);
    } else {
      ctx.strokeStyle=af?'rgba(255,255,255,0.06)':'rgba(255,255,255,0.065)';
      ctx.lineWidth=0.8; ctx.setLineDash([3,5]);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Nodes
  // When exactly one person is selected, compute overlap ratios for all other people
  const onePerson = selPeople.size === 1 ? [...selPeople][0] : null;

  // Pre-compute ratios and find max so we can normalise
  let overlapMap = null;
  if (onePerson) {
    overlapMap = {};
    let maxRatio = 0;
    for (const n of nodes) {
      if (n.type==='person' && !selPeople.has(n.label)) {
        const r = overlapRatio(onePerson, n.label);
        overlapMap[n.label] = r;
        if (r > maxRatio) maxRatio = r;
      }
    }
    // Normalise: person with highest overlap always gets max alpha
    if (maxRatio > 0) {
      for (const name in overlapMap) overlapMap[name] /= maxRatio;
    }
  }

  for (const node of nodes) {
    const p=wts(node.x,node.y);
    const r=node.radius*cam.scale;
    const active=isHighlighted(node);
    const isHov=hovNode&&hovNode.id===node.id;
    const isSel=node.type==='person'?selPeople.has(node.label):selCats.has(node.label);
    const color=node.color;

    // Compute alpha
    let alpha;
    if (!anyFilter()) {
      alpha = 0.75;
    } else if (onePerson && node.type==='person' && !isSel) {
      // Normalised overlap: best match → 0.85, no match → 0.08
      const ratio = overlapMap ? (overlapMap[node.label] ?? 0) : 0;
      alpha = 0.08 + ratio * (0.85 - 0.08);
    } else {
      alpha = active ? 1 : 0.38;
    }

    if (node.type==='interest') {
      // Glow
      if(active){
        ctx.beginPath();ctx.arc(p.x,p.y,r+8,0,Math.PI*2);
        ctx.fillStyle=ha(color,0.07);ctx.fill();
      }
      // Fill
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=ha(color,active?0.15:0.06);ctx.fill();
      // Border (solid for interests)
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.strokeStyle=ha(color,active?0.9:0.3);
      ctx.lineWidth=isSel?2.5:(isHov?2:1.5);ctx.stroke();
      if(isSel||isHov){
        ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);
        ctx.strokeStyle=ha(color,0.45);ctx.lineWidth=1;ctx.stroke();
      }
      // Label
      ctx.save();ctx.globalAlpha=alpha;
      const fs=Math.max(8,Math.min(12,r*0.32));
      ctx.font=`600 ${fs}px 'Cinzel',serif`;
      ctx.fillStyle=active?'#e8e4f0':'#7a7490';
      ctx.textAlign='center';ctx.textBaseline='middle';
      const words=node.label.split(' ');
      if(words.length>1&&r>26){
        const mid=Math.ceil(words.length/2);
        ctx.fillText(words.slice(0,mid).join(' '),p.x,p.y-fs*0.6);
        ctx.fillText(words.slice(mid).join(' '),p.x,p.y+fs*0.6);
      } else { ctx.fillText(node.label,p.x,p.y); }
      if(active&&r>26){
        ctx.font=`400 ${Math.max(7,fs-3)}px 'Raleway',sans-serif`;
        ctx.fillStyle=ha(color,0.7);
        ctx.fillText(node.members.length+' people',p.x,p.y+fs*1.6);
      }
      ctx.restore();
    } else {
      // Person node — grey, dashed border
      const GREY='#8a8898';
      ctx.save();ctx.globalAlpha=alpha;
      if(isSel){
        ctx.beginPath();ctx.arc(p.x,p.y,r+9,0,Math.PI*2);
        ctx.fillStyle='rgba(138,136,152,0.12)';ctx.fill();
      }
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=active?(isSel?'rgba(138,136,152,0.25)':'rgba(138,136,152,0.12)'):'rgba(138,136,152,0.05)';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.strokeStyle=active?(isSel?'rgba(200,198,210,0.9)':'rgba(138,136,152,0.75)'):'rgba(138,136,152,0.3)';
      ctx.lineWidth=isSel?2.5:(isHov?2:1.5);
      ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
      if(isHov||isSel){
        ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);
        ctx.strokeStyle='rgba(200,198,210,0.3)';ctx.lineWidth=1;ctx.stroke();
      }
      const fs=Math.max(8,Math.min(11,r*0.46));
      ctx.font=`500 ${fs}px 'Raleway',sans-serif`;
      ctx.fillStyle=active?'#c8c6d2':'#5a5868';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(node.label,p.x,p.y);
      ctx.restore();
    }
  }

  // Multibar
  const bar=document.getElementById('multibar');
  if(selPeople.size>=2){
    const sh=sharedInts();
    bar.textContent=[...selPeople].sort().join(' + ')+'  ·  '+sh.size+' shared interest'+(sh.size!==1?'s':'');
    bar.style.display='block';
  } else if(selPeople.size===1){
    const nm=[...selPeople][0];
    bar.textContent=nm+'  ·  '+(personCats[nm]||[]).length+' interests  ·  select more people to find overlap';
    bar.style.display='block';
  } else if(selCats.size>=2){
    const sp=sharedPeople();
    bar.textContent=[...selCats].join(' + ')+'  ·  '+sp.size+' '+(sp.size!==1?'people':'person')+' in common';
    bar.style.display='block';
  } else if(selCats.size===1){
    const cat=[...selCats][0];
    bar.textContent=cat+'  ·  '+CATS[cat].length+' people  ·  select more interests to find overlap';
    bar.style.display='block';
  } else {
    bar.style.display='none';
  }
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  // People: alphabetical, grey dots
  const pl=document.getElementById('person-list');
  for(const name of allPeopleRaw){
    const d=document.createElement('div');d.className='chip';d.dataset.name=name;
    d.innerHTML=`<span class="chip-dot" style="background:#8a8898"></span>${name}<span class="chip-count">${(personCats[name]||[]).length}</span>`;
    d.onclick=()=>togglePerson(name);pl.appendChild(d);
  }
  // Interests: alphabetical in sidebar
  const il=document.getElementById('interest-list');
  for(const cat of allCatsAlpha){
    const d=document.createElement('div');d.className='chip';d.dataset.cat=cat;
    d.innerHTML=`<span class="chip-dot" style="background:${catColorMap[cat]}"></span>${cat}<span class="chip-count">${CATS[cat].length}</span>`;
    d.onclick=()=>toggleCat(cat);il.appendChild(d);
  }
}

function syncChips(){
  document.querySelectorAll('.chip[data-name]').forEach(c=>c.classList.toggle('active',selPeople.has(c.dataset.name)));
  document.querySelectorAll('.chip[data-cat]').forEach(c=>c.classList.toggle('active',selCats.has(c.dataset.cat)));
}

function togglePerson(name){
  selCats.clear();
  selPeople.has(name)?selPeople.delete(name):selPeople.add(name);
  syncChips(); draw();
}

function toggleCat(cat){
  selPeople.clear();
  selCats.has(cat)?selCats.delete(cat):selCats.add(cat);
  syncChips(); draw();
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
function getHit(sx,sy){
  const w=stw(sx,sy);
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i],dx=w.x-n.x,dy=w.y-n.y;
    if(Math.sqrt(dx*dx+dy*dy)<n.radius) return n;
  }
  return null;
}

cv.addEventListener('mousedown',e=>{
  dragging=true;dragMoved=false;cv.classList.add('dragging');
  dragStart={x:e.clientX,y:e.clientY};camStart={x:cam.x,y:cam.y};
});

cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  if(dragging){
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    if(Math.abs(dx)+Math.abs(dy)>3) dragMoved=true;
    cam.x=camStart.x+dx/cam.scale;cam.y=camStart.y+dy/cam.scale;draw();return;
  }
  hovNode=getHit(sx,sy);cv.style.cursor=hovNode?'pointer':'grab';
  const tip=document.getElementById('tooltip');
  if(hovNode){
    tip.style.display='block';
    let html=`<div class="tip-title">${hovNode.label}</div>`;
    if(hovNode.type==='interest'){
      html+=hovNode.members.map(p=>`<div class="tip-item"><span class="tip-dot" style="background:#8a8898"></span>${p}</div>`).join('');
    } else {
      html+=(hovNode.cats||[]).map(c=>`<div class="tip-item"><span class="tip-dot" style="background:${catColorMap[c]||'#888'}"></span>${c}</div>`).join('');
    }
    tip.innerHTML=html;
    tip.style.left=Math.min(sx+14,W-235)+'px';
    tip.style.top=Math.max(sy-10,10)+'px';
  } else { tip.style.display='none'; }
  draw();
});

cv.addEventListener('mouseup',e=>{
  const wasDrag=dragMoved;dragging=false;dragMoved=false;cv.classList.remove('dragging');
  if(!wasDrag){
    const rect=cv.getBoundingClientRect();
    const hit=getHit(e.clientX-rect.left,e.clientY-rect.top);
    if(hit){
      if(hit.type==='person') togglePerson(hit.label);
      else toggleCat(hit.label);
    } else { clearAll(); }
  }
});

cv.addEventListener('mouseleave',()=>{
  dragging=false;hovNode=null;
  document.getElementById('tooltip').style.display='none';
  draw();
});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  const before=stw(sx,sy);
  cam.scale=Math.max(0.3,Math.min(3.5,cam.scale*(e.deltaY<0?1.1:0.9)));
  const after=stw(sx,sy);
  cam.x+=after.x-before.x;cam.y+=after.y-before.y;draw();
},{passive:false});

function clearAll(){ selPeople.clear(); selCats.clear(); syncChips(); draw(); }

document.getElementById('reset-btn').onclick=()=>{ cam={x:0,y:0,scale:1}; clearAll(); };

document.getElementById('download-btn').onclick=()=>{
  // Find bounding box of all nodes in screen space
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const node of nodes){
    const p=wts(node.x,node.y);
    const r=node.radius*cam.scale+10;
    minX=Math.min(minX,p.x-r); minY=Math.min(minY,p.y-r);
    maxX=Math.max(maxX,p.x+r); maxY=Math.max(maxY,p.y+r);
  }
  const pad=24;
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(W,maxX+pad); maxY=Math.min(H,maxY+pad);
  const cw=Math.ceil((maxX-minX)*DPR), ch=Math.ceil((maxY-minY)*DPR);
  const temp=document.createElement('canvas'); temp.width=cw; temp.height=ch;
  const tctx=temp.getContext('2d');
  tctx.fillStyle='#0f0e17'; tctx.fillRect(0,0,cw,ch);
  tctx.drawImage(cv, minX*DPR, minY*DPR, cw, ch, 0, 0, cw, ch);
  const link=document.createElement('a'); link.download='friend-interest-map.png';
  link.href=temp.toDataURL('image/png'); link.click();
};

window.addEventListener('resize',()=>{ ctx.setTransform(1,0,0,1,0,0); resize(); });
buildSidebar();
setTimeout(()=>resize(), 50);
</script>
