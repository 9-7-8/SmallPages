<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blank Page</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Layout and sizing only. Colour and components live in theme.css, except
     where this page needs to be quieter than the rest of them. */

  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* Two alternatives to the house dark, because a page you stare at for an
     hour is a different proposition from one you glance at. */
  body[data-paper="light"] { background: #f7f6f3; color: #26241f; }
  body[data-paper="sepia"] { background: #f2e8d5; color: #3b3121; }
  body[data-paper="light"] ::selection,
  body[data-paper="sepia"] ::selection { background: #cbbfa4; color: #1a1611; }

  /* ----------------------------------------------------------- the sheet -- */

  main { height: 100%; display: flex; justify-content: center; }

  #sheet, #preview {
    width: 100%;
    max-width: var(--measure, 38rem);
    height: 100%;
    box-sizing: border-box;
    padding: 18vh 1.5rem 50vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #sheet::-webkit-scrollbar, #preview::-webkit-scrollbar { display: none; }

  #sheet {
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    color: inherit;
    font-family: var(--writing, var(--sans));
    font-size: var(--size, 17px);
    line-height: 1.75;
    letter-spacing: 0.005em;
    caret-color: var(--neon);
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  #sheet:focus { outline: 0; box-shadow: none; }
  body[data-paper="light"] #sheet, body[data-paper="sepia"] #sheet { caret-color: #b2563a; }

  /* Focus mode: the page keeps only the middle of itself bright, which with
     typewriter scrolling is the line being written. */
  body[data-focus="on"] #sheet {
    -webkit-mask-image: linear-gradient(to bottom,
      rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.10) 22%, rgba(0,0,0,1) 42%,
      rgba(0,0,0,1) 58%, rgba(0,0,0,0.10) 78%, rgba(0,0,0,0.10) 100%);
    mask-image: linear-gradient(to bottom,
      rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.10) 22%, rgba(0,0,0,1) 42%,
      rgba(0,0,0,1) 58%, rgba(0,0,0,0.10) 78%, rgba(0,0,0,0.10) 100%);
  }

  /* A caret that is being typed with does not need a pointer sitting over it. */
  body[data-typing="yes"] { cursor: none; }

  /* The mirror is how the caret's height is measured; it is never seen. */
  #mirror {
    position: absolute;
    top: 0; left: -9999px;
    visibility: hidden;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  /* --------------------------------------------------------- the preview -- */

  #preview { font-size: var(--size, 17px); line-height: 1.75; font-family: var(--writing, var(--sans)); }
  #preview > :first-child { margin-top: 0; }
  #preview h1, #preview h2, #preview h3,
  #preview h4, #preview h5, #preview h6 { line-height: 1.25; margin: 1.8em 0 0.6em; font-weight: 400; }
  #preview h1 { font-size: 1.7em; }
  #preview h2 { font-size: 1.38em; }
  #preview h3 { font-size: 1.15em; }
  #preview h4, #preview h5, #preview h6 { font-size: 1em; color: var(--text-dim); }
  #preview p, #preview ul, #preview ol, #preview blockquote, #preview pre { margin: 0 0 1.1em; }
  #preview ul, #preview ol { padding-left: 1.4em; }
  #preview li { margin: 0.2em 0; }
  #preview blockquote {
    margin-left: 0;
    padding-left: 1em;
    border-left: 2px solid var(--line);
    color: var(--text-dim);
  }
  #preview code {
    font-family: var(--mono);
    font-size: 0.88em;
    background: hsl(var(--tint) / 0.1);
    padding: 0.1em 0.35em;
  }
  #preview pre {
    background: hsl(var(--tint) / 0.08);
    padding: 0.9em 1em;
    overflow-x: auto;
  }
  #preview pre code { background: none; padding: 0; }
  #preview hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  #preview a { color: var(--neon); }
  #preview del { opacity: 0.6; }

  /* ------------------------------------------------------------- the bar -- */

  /* Nothing is on screen until the pointer goes looking for it at the top. */
  #peek { position: fixed; top: 0; left: 0; right: 0; height: 2.2rem; z-index: 5; }

  #bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 6;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3rem;
    padding: 0.5rem 0.7rem;
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
    transform: translateY(-110%);
    opacity: 0;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }
  body[data-paper="light"] #bar { background: #efede8; border-color: #d8d4c9; }
  body[data-paper="sepia"] #bar { background: #e8dcc4; border-color: #d2c3a3; }
  #bar.open { transform: translateY(0); opacity: 1; }
  /* Tabbing into it must bring it down too, or the controls are unreachable. */
  #bar:focus-within { transform: translateY(0); opacity: 1; }

  /* Tight, because the whole set has to stay on one line: a bar that wraps
     to a second row on a laptop is twice the thing to look past. */
  #bar button, #bar select {
    font-size: 0.74rem;
    padding: 0.3rem 0.4rem;
    letter-spacing: 0.02em;
  }
  #bar select { font-family: var(--sans); }
  /* A select is as wide as its longest option, so without this one long
     document name shoves everything after it onto a second row. */
  #docsSel { max-width: 9rem; }
  #titleIn {
    flex: 1 1 6rem;
    min-width: 4.5rem;
    font-size: 0.8rem;
    padding: 0.3rem 0.5rem;
  }
  #bar .gap { width: 1px; align-self: stretch; background: var(--line-soft); margin: 0 0.15rem; }
  #bar .spacer { flex: 1 1 0; }
  #bar a {
    font-size: 0.74rem;
    color: var(--text-faint);
    text-decoration: none;
    padding: 0.3rem 0.4rem;
  }
  #bar a:hover { color: var(--neon); }

  /* ----------------------------------------------------------- the tally -- */

  #tally {
    position: fixed;
    right: 1rem;
    bottom: 0.7rem;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.7rem;
    color: var(--text-faint);
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  body[data-tally="off"] #tally { display: none; }
  body[data-typing="yes"] #tally { opacity: 0.16; }

  #flash {
    position: fixed;
    left: 50%;
    bottom: 1.4rem;
    transform: translateX(-50%);
    font-size: 0.76rem;
    color: var(--neon);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #flash.show { opacity: 1; }

  @media (max-width: 620px) {
    #sheet, #preview { padding: 10vh 1.1rem 50vh; }
    #bar { gap: 0.3rem; padding: 0.5rem; }
  }
</style>
</head>
<body data-paper="dark" data-tally="on">

<div id="peek"></div>

<header id="bar">
  <input type="text" id="titleIn" placeholder="Untitled" aria-label="Document name" spellcheck="false">

  <button type="button" id="newBtn">New</button>
  <select id="docsSel" aria-label="Open a document"></select>
  <button type="button" id="openBtn">Open</button>
  <input type="file" id="fileIn" accept=".md,.markdown,.txt,.text" hidden>
  <select id="saveSel" aria-label="Save as">
    <option value="md">.md</option>
    <option value="txt">.txt</option>
    <option value="html">.html</option>
    <option value="rtf">.rtf</option>
    <option value="docx">.docx</option>
    <option value="odt">.odt</option>
  </select>
  <button type="button" id="saveBtn">Save</button>

  <span class="gap"></span>

  <button type="button" id="previewBtn" aria-pressed="false">Preview</button>
  <button type="button" id="focusBtn" aria-pressed="false">Focus</button>
  <button type="button" id="typerBtn" aria-pressed="false">Typewriter</button>

  <span class="gap"></span>

  <select id="paperSel" aria-label="Paper">
    <option value="dark" selected>Dark</option>
    <option value="light">Light</option>
    <option value="sepia">Sepia</option>
  </select>
  <select id="fontSel" aria-label="Typeface">
    <option value="sans" selected>Sans</option>
    <option value="serif">Serif</option>
    <option value="mono">Mono</option>
  </select>
  <select id="sizeSel" aria-label="Size">
    <option value="15">15</option>
    <option value="17" selected>17</option>
    <option value="19">19</option>
    <option value="22">22</option>
  </select>
  <select id="widthSel" aria-label="Measure">
    <option value="30">Narrow</option>
    <option value="38" selected>Medium</option>
    <option value="48">Wide</option>
    <option value="100">Full</option>
  </select>

  <span class="gap"></span>

  <button type="button" id="tallyBtn" aria-pressed="true">Count</button>
  <button type="button" id="fullBtn">Full</button>
  <button type="button" id="deleteBtn">Delete</button>

  <span class="spacer"></span>
  <a href="index.html">&larr; index</a>
</header>

<main>
  <textarea id="sheet" spellcheck="true" autocomplete="off"
            placeholder="Just write. Markdown as you type it — **bold**, *italic*, # a heading. The menu is at the top of the screen if you go looking."></textarea>
  <article id="preview" hidden></article>
</main>

<div id="mirror" aria-hidden="true"></div>
<div id="tally"></div>
<div id="flash"></div>

<script>
"use strict";

const el = (id) => document.getElementById(id);

const sheet = el("sheet");
const preview = el("preview");
const mirror = el("mirror");
const bar = el("bar");
const titleIn = el("titleIn");
const docsSel = el("docsSel");

const STORE = "blank-page.docs";
const PREFS = "blank-page.prefs";

/* Everything here is wrapped: a private window throws on the first touch of
   localStorage, and a writing page that will not open is worse than one that
   forgets. It keeps working, forgetfully. */
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}

let docs = load(STORE, null);
if (!Array.isArray(docs) || !docs.length) {
  docs = [{ id: fresh(), title: "", text: "", updated: Date.now() }];
}
let currentId = load("blank-page.current", null);
if (!docs.some((d) => d.id === currentId)) currentId = docs[0].id;

function fresh() {
  return `d${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}
const current = () => docs.find((d) => d.id === currentId) || docs[0];

/* ------------------------------------------------------------- the prefs -- */

const FONTS = {
  sans: "var(--sans)",
  serif: "Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif",
  mono: "var(--mono)",
};

const prefs = Object.assign({
  paper: "dark", font: "sans", size: "17", width: "38",
  focus: false, typewriter: false, tally: true, save: "md",
}, load(PREFS, {}));

function applyPrefs() {
  document.body.dataset.paper = prefs.paper;
  document.body.dataset.focus = prefs.focus ? "on" : "off";
  document.body.dataset.tally = prefs.tally ? "on" : "off";
  document.documentElement.style.setProperty("--writing", FONTS[prefs.font] || FONTS.sans);
  document.documentElement.style.setProperty("--size", `${prefs.size}px`);
  document.documentElement.style.setProperty("--measure", prefs.width === "100" ? "100%" : `${prefs.width}rem`);

  el("paperSel").value = prefs.paper;
  el("fontSel").value = prefs.font;
  el("sizeSel").value = String(prefs.size);
  el("widthSel").value = String(prefs.width);
  el("saveSel").value = SAVE_AS[prefs.save] ? prefs.save : "md";
  el("focusBtn").setAttribute("aria-pressed", String(!!prefs.focus));
  el("typerBtn").setAttribute("aria-pressed", String(!!prefs.typewriter));
  el("tallyBtn").setAttribute("aria-pressed", String(!!prefs.tally));
  save(PREFS, prefs);
}

/* ------------------------------------------------------------ the saving -- */

let writeTimer = null;

function remember() {
  const doc = current();
  doc.text = sheet.value;
  doc.title = titleIn.value;
  doc.updated = Date.now();
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => {
    if (!save(STORE, docs)) flash("This browser will not store anything — save a file instead");
    save("blank-page.current", currentId);
    // Renamed in place rather than rebuilt: rebuilding the list under an open
    // dropdown would shut it mid-choice.
    const option = [...docsSel.options].find((o) => o.value === currentId);
    if (option) option.textContent = nameOf(doc);
  }, 400);
}

function flash(words) {
  const note = el("flash");
  note.textContent = words;
  note.classList.add("show");
  clearTimeout(flash.timer);
  flash.timer = setTimeout(() => note.classList.remove("show"), 1800);
}

/* ---------------------------------------------------------- the documents -- */

// A line of the writing is a better name than "Untitled", and it is what you
// would call the thing yourself when looking down a list.
function nameOf(doc) {
  if (doc.title.trim()) return doc.title.trim();
  const first = (doc.text.split("\n").find((l) => l.trim()) || "").replace(/^#+\s*/, "").trim();
  return first ? first.slice(0, 42) : "Untitled";
}

function listDocs() {
  docsSel.replaceChildren();
  for (const doc of [...docs].sort((a, b) => b.updated - a.updated)) {
    const option = document.createElement("option");
    option.value = doc.id;
    option.textContent = nameOf(doc);
    docsSel.append(option);
  }
  docsSel.value = currentId;
}

function show(id) {
  currentId = id;
  const doc = current();
  sheet.value = doc.text;
  titleIn.value = doc.title;
  save("blank-page.current", currentId);
  listDocs();
  count();
  if (!preview.hidden) renderPreview();
  sheet.focus();
}

el("newBtn").addEventListener("click", () => {
  // Nothing is replaced: the one being written stays in the list behind it.
  docs.push({ id: fresh(), title: "", text: "", updated: Date.now() });
  save(STORE, docs);
  show(docs[docs.length - 1].id);
  flash("New page — the last one is still in the list");
});

docsSel.addEventListener("change", () => show(docsSel.value));

el("deleteBtn").addEventListener("click", () => {
  const doc = current();
  const words = wordsIn(doc.text);
  if (words > 0 && !confirm(`Delete "${nameOf(doc)}"? ${words} words, and this cannot be undone.`)) return;
  docs = docs.filter((d) => d.id !== currentId);
  if (!docs.length) docs = [{ id: fresh(), title: "", text: "", updated: Date.now() }];
  save(STORE, docs);
  show(docs[0].id);
  flash("Deleted");
});

/* ----------------------------------------------------------- the markdown -- */

const escapeHtml = (text) => text
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

// Escaped first, always: the preview renders what was typed, never runs it.
function inline(text) {
  const code = [];
  let out = escapeHtml(text)
    .replace(/`([^`]+)`/g, (all, body) => `\u0000${code.push(body) - 1}\u0000`);

  out = out
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (all, alt, src) => `<img src="${src}" alt="${alt}">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>')
    .replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/__([^_]+)__/g, "<u>$1</u>")
    .replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  return out.replace(/\u0000(\d+)\u0000/g, (all, i) => `<code>${code[Number(i)]}</code>`);
}

function toHtml(source) {
  const lines = source.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let para = [];
  let list = null;      // "ul" | "ol"
  let quote = [];
  let fence = null;     // the lines gathered inside ``` so far

  const endPara = () => { if (para.length) { out.push(`<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`); para = []; } };
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const endQuote = () => {
    if (quote.length) { out.push(`<blockquote>${toHtml(quote.join("\n"))}</blockquote>`); quote = []; }
  };
  const endAll = () => { endPara(); endList(); endQuote(); };

  for (const line of lines) {
    const fenced = /^\s*```(.*)$/.exec(line);
    if (fence !== null) {
      if (fenced) { out.push(`<pre><code>${escapeHtml(fence.join("\n"))}</code></pre>`); fence = null; }
      else fence.push(line);
      continue;
    }
    if (fenced) { endAll(); fence = []; continue; }

    if (/^\s*$/.test(line)) { endAll(); continue; }

    const quoted = /^\s*>\s?(.*)$/.exec(line);
    if (quoted) { endPara(); endList(); quote.push(quoted[1]); continue; }
    endQuote();

    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    if (heading) {
      endAll();
      const level = heading[1].length;
      out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { endAll(); out.push("<hr>"); continue; }

    const bullet = /^\s*[-*+]\s+(.*)$/.exec(line);
    const numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (bullet || numbered) {
      endPara();
      const want = bullet ? "ul" : "ol";
      if (list !== want) { endList(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${inline((bullet || numbered)[1])}</li>`);
      continue;
    }
    endList();

    para.push(line);
  }
  if (fence !== null) out.push(`<pre><code>${escapeHtml(fence.join("\n"))}</code></pre>`);
  endAll();
  return out.join("\n");
}

function renderPreview() {
  preview.innerHTML = toHtml(sheet.value);
}

el("previewBtn").addEventListener("click", () => togglePreview());

function togglePreview(force) {
  const on = force === undefined ? preview.hidden : force;
  if (on) renderPreview();
  preview.hidden = !on;
  sheet.hidden = on;
  el("previewBtn").setAttribute("aria-pressed", String(on));
  if (!on) sheet.focus();
}

/* ------------------------------------------------------------ the counting -- */

const wordsIn = (text) => (text.trim().match(/\S+/g) || []).length;

function count() {
  const words = wordsIn(sheet.value);
  const minutes = Math.max(1, Math.round(words / 220));
  el("tally").textContent = words
    ? `${words.toLocaleString()} words · ${sheet.value.length.toLocaleString()} characters · ${minutes} min read`
    : "";
}

/* ---------------------------------------------------------- the typewriter -- */

// A textarea cannot say where its caret is on screen, so the text up to the
// caret is laid out again in a hidden copy with the same metrics and the
// marker's offset is read off that.
function caretTop() {
  const style = getComputedStyle(sheet);
  for (const prop of ["fontFamily", "fontSize", "fontWeight", "lineHeight",
                      "letterSpacing", "paddingLeft", "paddingRight", "paddingTop"]) {
    mirror.style[prop] = style[prop];
  }
  mirror.style.width = `${sheet.clientWidth}px`;
  mirror.textContent = sheet.value.slice(0, sheet.selectionStart);
  const marker = document.createElement("span");
  marker.textContent = "​";
  mirror.append(marker);
  return marker.offsetTop;
}

function typewriter() {
  if (!prefs.typewriter || sheet.hidden) return;
  const wanted = caretTop() - sheet.clientHeight / 2;
  sheet.scrollTop = Math.max(0, wanted);
}

/* -------------------------------------------------------------- the files -- */

/* Six ways out. `.md` and `.txt` are the writing exactly as it was typed —
   Markdown is plain text, so the only difference between them is the name a
   program will open the file with. The other four are the preview rather than
   the source: the same `toHtml` the preview uses is parsed back into a tree
   and walked once, so a heading, a list or a bold word reaches Word, LibreOffice
   or a browser as a heading, a list or a bold word rather than as asterisks.

   One document model, four writers. Nothing is fetched and nothing is uploaded:
   a `.docx` and an `.odt` are zips of XML, and the zip is written here. */

const SAVE_AS = {
  md:   { name: "Markdown", type: "text/markdown;charset=utf-8" },
  txt:  { name: "plain text", type: "text/plain;charset=utf-8" },
  html: { name: "a web page", type: "text/html;charset=utf-8" },
  rtf:  { name: "rich text", type: "application/rtf" },
  docx: { name: "a Word document", type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" },
  odt:  { name: "an OpenDocument", type: "application/vnd.oasis.opendocument.text" },
};

/* ------------------------------------------------------- what is written -- */

const xmlEsc = (text) => String(text)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
  // Control characters are not legal in XML at all, and a stray one makes the
  // whole file unopenable rather than slightly wrong.
  .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "");

const MARKS = { strong: "b", b: "b", em: "i", i: "i", u: "u", del: "s", s: "s", code: "code" };

// The preview's own HTML, parsed in a document of its own so that nothing is
// loaded and nothing is run: this is the same tree the reader will see.
function renderedTree() {
  const doc = document.implementation.createHTMLDocument("");
  doc.body.innerHTML = toHtml(sheet.value);
  return doc.body;
}

// A flat list of pieces of text, each carrying the marks it sits under, which
// is the shape every one of the four writers wants.
function runsOf(node, carried = {}) {
  const out = [];
  for (const child of node.childNodes) {
    if (child.nodeType === Node.TEXT_NODE) {
      if (child.data) out.push({ ...carried, text: child.data });
      continue;
    }
    if (child.nodeType !== Node.ELEMENT_NODE) continue;
    const tag = child.localName;
    if (tag === "br") { out.push({ ...carried, br: true, text: "" }); continue; }
    // A picture cannot come along: its source is a URL this page has not
    // fetched and may not be allowed to. The alt text and the link go instead,
    // which is at least a true account of what was there.
    if (tag === "img") {
      const alt = (child.getAttribute("alt") || "").trim();
      out.push({ ...carried, href: child.getAttribute("src") || carried.href, text: `[${alt || "image"}]` });
      continue;
    }
    const marks = { ...carried };
    if (MARKS[tag]) marks[MARKS[tag]] = true;
    if (tag === "a") marks.href = child.getAttribute("href") || "";
    out.push(...runsOf(child, marks));
  }
  return out;
}

// Each list gets a number of its own so that a second numbered list starts at
// one again instead of carrying on from where the first stopped.
function blocksOf(root, lists = { n: 0 }, depth = 0) {
  const out = [];
  for (const node of root.children) {
    const tag = node.localName;
    const heading = /^h([1-6])$/.exec(tag);
    if (heading) { out.push({ kind: "heading", level: Number(heading[1]), runs: runsOf(node), depth }); continue; }
    if (tag === "hr") { out.push({ kind: "rule", runs: [], depth }); continue; }
    if (tag === "pre") { out.push({ kind: "code", text: node.textContent.replace(/\n+$/, ""), runs: [], depth }); continue; }
    if (tag === "blockquote") {
      for (const inner of blocksOf(node, lists, depth + 1)) out.push({ ...inner, quote: true });
      continue;
    }
    if (tag === "ul" || tag === "ol") {
      const list = ++lists.n;
      let index = 0;
      for (const item of node.children) {
        if (item.localName !== "li") continue;
        out.push({ kind: "item", ordered: tag === "ol", list, index: ++index, runs: runsOf(item), depth });
      }
      continue;
    }
    out.push({ kind: "para", runs: runsOf(node), depth });
  }
  return out;
}

/* --------------------------------------------------------------- a page -- */

// Styled, because a browser's default serif at full window width is not a
// document; self-contained, because a saved page that wants a stylesheet off
// this site is a page that stops working the moment it is moved.
function asHtml(title) {
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0 auto; padding: 4rem 1.5rem 6rem; max-width: 38rem;
    font: 17px/1.75 Georgia, 'Iowan Old Style', Palatino, serif;
    background: #fdfcfa; color: #26241f;
  }
  h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.8em 0 0.6em; font-weight: 600; }
  h1 { font-size: 1.7em; } h2 { font-size: 1.38em; } h3 { font-size: 1.15em; }
  h4, h5, h6 { font-size: 1em; }
  p, ul, ol, blockquote, pre { margin: 0 0 1.1em; }
  ul, ol { padding-left: 1.4em; } li { margin: 0.2em 0; }
  blockquote { margin-left: 0; padding-left: 1em; border-left: 2px solid #c9c4b8; color: #57524a; }
  code { font: 0.88em/1.6 ui-monospace, 'SF Mono', Consolas, monospace; background: #efece6; padding: 0.1em 0.35em; }
  pre { background: #efece6; padding: 0.9em 1em; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  hr { border: 0; border-top: 1px solid #c9c4b8; margin: 2em 0; }
  img { max-width: 100%; height: auto; }
  @media print { body { background: #fff; padding: 0; max-width: none; } }
  @media (prefers-color-scheme: dark) {
    body { background: #16151a; color: #ddd8d0; }
    blockquote { border-color: #3c3a42; color: #9c968c; }
    code, pre { background: #22212a; }
    hr { border-color: #3c3a42; }
  }
</style>
</head>
<body>
${toHtml(sheet.value)}
</body>
</html>
`;
}

/* ----------------------------------------------------------- rich text -- */

/* RTF is ASCII with a brace language over it, which is why it opens anywhere:
   anything outside ASCII goes out as `\uN?` escapes, one per UTF-16 unit, so
   an em dash or an emoji survives a reader that has never heard of Unicode. */

function rtfText(text) {
  let out = "";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const code = text.charCodeAt(i);
    if (ch === "\\" || ch === "{" || ch === "}") out += "\\" + ch;
    else if (ch === "\n") out += "\\line ";
    else if (ch === "\t") out += "\\tab ";
    else if (code >= 32 && code < 127) out += ch;
    else if (code < 32) continue;
    else out += `\\u${code > 32767 ? code - 65536 : code}?`;
  }
  return out;
}

function rtfRuns(runs) {
  let out = "";
  for (const run of runs) {
    if (run.br) { out += "\\line "; continue; }
    let on = "", off = "";
    if (run.b) { on += "\\b"; off = "\\b0" + off; }
    if (run.i) { on += "\\i"; off = "\\i0" + off; }
    if (run.u) { on += "\\ul"; off = "\\ulnone" + off; }
    if (run.s) { on += "\\strike"; off = "\\strike0" + off; }
    if (run.code) { on += "\\f1"; off = "\\f0" + off; }
    if (run.href) { on += "\\cf1\\ul"; off = "\\ulnone\\cf0" + off; }
    // The space after a control word is what ends it and is swallowed, so it
    // goes in only where there is a control word in front of it: added to a
    // bare run it is a space in the text that nobody typed.
    const body = (on ? `${on} ` : "") + rtfText(run.text) + (off ? `${off} ` : "");
    /* A field, so the link is clickable in a reader that understands one and
       is plain underlined text in a reader that does not. The instruction is
       left flat rather than wrapped in a group of its own: both are legal,
       and the flat one is what a reader that skips `{\*...}` groups whole
       can skip, instead of spilling the URL into the text. */
    out += run.href
      ? `{\\field{\\*\\fldinst HYPERLINK "${rtfText(run.href)}"}{\\fldrslt{${body}}}}`
      : body;
  }
  return out;
}

const RTF_HEAD = [0, 34, 28, 24, 22, 21, 20];   // half-points, h1 down to h6

function asRtf() {
  const lines = [];
  for (const block of blocksOf(renderedTree())) {
    const indent = (block.quote ? 567 : 0) + (block.kind === "item" ? 360 : 0);
    const left = indent ? `\\li${indent}` : "";
    const edge = block.quote ? "\\brdrl\\brdrs\\brdrw10\\brsp80" : "";

    if (block.kind === "rule") {
      lines.push(`{\\pard${left}\\brdrb\\brdrs\\brdrw10\\brsp20\\sa180\\par}`);
    } else if (block.kind === "code") {
      const rows = block.text.split("\n");
      rows.forEach((row, i) => {
        lines.push(`\\pard${edge}\\li${indent + 360}\\sa${i === rows.length - 1 ? 180 : 0}`
          + `\\f1\\fs20 ${rtfText(row)}\\f0\\fs22\\par`);
      });
    } else if (block.kind === "heading") {
      lines.push(`\\pard${edge}${left}\\sb240\\sa120\\keepn\\outlinelevel${block.level - 1}`
        + `\\b\\fs${RTF_HEAD[block.level]} `
        + `${rtfRuns(block.runs)}\\b0\\fs22\\par`);
    } else if (block.kind === "item") {
      const marker = block.ordered ? `${block.index}.` : "\\bullet";
      lines.push(`\\pard${edge}\\li${indent + 360}\\fi-360\\sa60 ${marker}\\tab ${rtfRuns(block.runs)}\\par`);
    } else {
      lines.push(`\\pard${edge}${left}\\sa180 ${rtfRuns(block.runs)}\\par`);
    }
  }
  if (!lines.length) lines.push("\\pard\\sa180\\par");

  return "{\\rtf1\\ansi\\ansicpg1252\\deff0\\uc1\n"
    + "{\\fonttbl{\\f0\\fswiss\\fcharset0 Calibri;}{\\f1\\fmodern\\fcharset0 Consolas;}}\n"
    + "{\\colortbl;\\red17\\green85\\blue204;}\n"
    + "\\fs22\\f0\n" + lines.join("\n") + "\n}";
}

/* ----------------------------------------------------------------- zips -- */

/* A .docx and an .odt are both a zip of XML, and pdf-builder.html already
   reads one with DecompressionStream; this is the same trade going the other
   way. Entries are deflated where the browser will do it and stored where it
   will not, which costs nothing but size — except for an .odt's `mimetype`,
   which the format requires be stored, uncompressed, and first. */

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// The time in the shape MS-DOS used in 1980, which is what a zip still carries.
function dosStamp(when) {
  const year = Math.max(1980, when.getFullYear());
  return {
    time: (when.getHours() << 11) | (when.getMinutes() << 5) | (when.getSeconds() >> 1),
    date: ((year - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate(),
  };
}

async function deflateRaw(bytes) {
  if (typeof CompressionStream !== "function") return null;
  try {
    const packed = new Response(new Blob([bytes]).stream()
      .pipeThrough(new CompressionStream("deflate-raw")));
    const out = new Uint8Array(await packed.arrayBuffer());
    return out.length < bytes.length ? out : null;
  } catch { return null; }
}

async function zipUp(entries, type) {
  const when = dosStamp(new Date());
  const encoder = new TextEncoder();
  const parts = [];
  const directory = [];
  let offset = 0;

  for (const entry of entries) {
    const name = encoder.encode(entry.name);
    const body = typeof entry.body === "string" ? encoder.encode(entry.body) : entry.body;
    const packed = entry.store ? null : await deflateRaw(body);
    const bytes = packed || body;
    const crc = crc32(body);

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);              // the name is UTF-8
    local.setUint16(8, packed ? 8 : 0, true);      // deflated, or stored
    local.setUint16(10, when.time, true);
    local.setUint16(12, when.date, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, bytes.length, true);
    local.setUint32(22, body.length, true);
    local.setUint16(26, name.length, true);
    local.setUint16(28, 0, true);

    parts.push(new Uint8Array(local.buffer), name, bytes);
    directory.push({ name, crc, packed: !!packed, size: bytes.length, full: body.length, offset });
    offset += 30 + name.length + bytes.length;
  }

  const central = [];
  let centralSize = 0;
  for (const item of directory) {
    const head = new DataView(new ArrayBuffer(46));
    head.setUint32(0, 0x02014b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 20, true);
    head.setUint16(8, 0x0800, true);
    head.setUint16(10, item.packed ? 8 : 0, true);
    head.setUint16(12, when.time, true);
    head.setUint16(14, when.date, true);
    head.setUint32(16, item.crc, true);
    head.setUint32(20, item.size, true);
    head.setUint32(24, item.full, true);
    head.setUint16(28, item.name.length, true);
    head.setUint32(42, item.offset, true);
    central.push(new Uint8Array(head.buffer), item.name);
    centralSize += 46 + item.name.length;
  }

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, directory.length, true);
  end.setUint16(10, directory.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);

  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type });
}

/* ------------------------------------------------------ a Word document -- */

const W_NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '
  + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';

function docxRuns(runs, links) {
  let out = "";
  for (const run of runs) {
    if (run.br) { out += "<w:r><w:br/></w:r>"; continue; }
    const props = [];
    if (run.b) props.push("<w:b/>");
    if (run.i) props.push("<w:i/>");
    if (run.u || run.href) props.push('<w:u w:val="single"/>');
    if (run.s) props.push("<w:strike/>");
    if (run.code) props.push('<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/>');
    if (run.href) props.push('<w:color w:val="1155CC"/>');
    const rPr = props.length ? `<w:rPr>${props.join("")}</w:rPr>` : "";
    const body = run.text.split("\n")
      .map((piece) => `<w:t xml:space="preserve">${xmlEsc(piece)}</w:t>`)
      .join("<w:br/>");
    const r = `<w:r>${rPr}${body}</w:r>`;
    out += run.href ? `<w:hyperlink r:id="${links.id(run.href)}">${r}</w:hyperlink>` : r;
  }
  return out;
}

async function asDocx(title) {
  // Relationship ids are handed out as the links are met, and the same target
  // twice gets the same id rather than two.
  const seen = new Map();
  const links = {
    id(href) {
      if (!seen.has(href)) seen.set(href, `rId${seen.size + 10}`);
      return seen.get(href);
    },
  };

  const numbered = new Set();
  const body = [];
  for (const block of blocksOf(renderedTree())) {
    const ind = block.quote ? '<w:ind w:left="567"/>' : "";
    const edge = block.quote
      ? '<w:pBdr><w:left w:val="single" w:sz="12" w:space="8" w:color="C9C4B8"/></w:pBdr>' : "";

    if (block.kind === "rule") {
      body.push('<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="auto"/>'
        + "</w:pBdr></w:pPr></w:p>");
    } else if (block.kind === "code") {
      const rows = block.text.split("\n");
      for (const row of rows) {
        body.push('<w:p><w:pPr><w:pStyle w:val="SourceCode"/>' + edge + ind + "</w:pPr>"
          + `<w:r><w:t xml:space="preserve">${xmlEsc(row)}</w:t></w:r></w:p>`);
      }
    } else if (block.kind === "heading") {
      body.push(`<w:p><w:pPr><w:pStyle w:val="Heading${block.level}"/>${edge}${ind}</w:pPr>`
        + `${docxRuns(block.runs, links)}</w:p>`);
    } else if (block.kind === "item") {
      if (block.ordered) numbered.add(block.list);
      const numId = block.ordered ? 100 + block.list : 1;
      body.push('<w:p><w:pPr><w:pStyle w:val="ListParagraph"/>'
        + `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="${numId}"/></w:numPr>${edge}</w:pPr>`
        + `${docxRuns(block.runs, links)}</w:p>`);
    } else {
      body.push(`<w:p>${edge || ind ? `<w:pPr>${edge}${ind}</w:pPr>` : ""}`
        + `${docxRuns(block.runs, links)}</w:p>`);
    }
  }
  if (!body.length) body.push("<w:p/>");

  const lvl = (format, text, extra = "") =>
    `<w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="${format}"/>`
    + `<w:lvlText w:val="${text}"/><w:lvlJc w:val="left"/>`
    + '<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>' + extra + "</w:lvl>";

  const numbering = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:numbering ${W_NS}>
<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>${lvl("bullet", "•")}</w:abstractNum>
${[...numbered].map((list) =>
  `<w:abstractNum w:abstractNumId="${list}"><w:multiLevelType w:val="hybridMultilevel"/>${lvl("decimal", "%1.")}</w:abstractNum>`).join("")}
<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>
${[...numbered].map((list) => `<w:num w:numId="${100 + list}"><w:abstractNumId w:val="${list}"/></w:num>`).join("")}
</w:numbering>`;

  const heading = (level, size, before) =>
    `<w:style w:type="paragraph" w:styleId="Heading${level}">`
    + `<w:name w:val="heading ${level}"/><w:basedOn w:val="Normal"/><w:qFormat/>`
    + `<w:pPr><w:keepNext/><w:spacing w:before="${before}" w:after="120"/><w:outlineLvl w:val="${level - 1}"/></w:pPr>`
    + `<w:rPr><w:b/><w:sz w:val="${size}"/></w:rPr></w:style>`;

  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles ${W_NS}>
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault>
<w:pPrDefault><w:pPr><w:spacing w:after="180" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
${[1, 2, 3, 4, 5, 6].map((level) => heading(level, RTF_HEAD[level], level === 1 ? 0 : 240)).join("")}
<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:qFormat/>
<w:pPr><w:spacing w:after="60"/><w:contextualSpacing/></w:pPr></w:style>
<w:style w:type="paragraph" w:styleId="SourceCode"><w:name w:val="Source Code"/><w:basedOn w:val="Normal"/>
<w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:ind w:left="360"/></w:pPr>
<w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/><w:sz w:val="20"/></w:rPr></w:style>
</w:styles>`;

  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>
${[...seen].map(([href, id]) =>
  `<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink"`
  + ` Target="${xmlEsc(href)}" TargetMode="External"/>`).join("\n")}
</Relationships>`;

  return zipUp([
    { name: "[Content_Types].xml", body: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
</Types>` },
    { name: "_rels/.rels", body: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
</Relationships>` },
    { name: "docProps/core.xml", body: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"
 xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"
 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<dc:title>${xmlEsc(title)}</dc:title>
<dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+/, "")}</dcterms:created>
</cp:coreProperties>` },
    { name: "word/_rels/document.xml.rels", body: rels },
    { name: "word/styles.xml", body: styles },
    { name: "word/numbering.xml", body: numbering },
    { name: "word/document.xml", body: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document ${W_NS}><w:body>
${body.join("\n")}
<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>
<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/>
</w:sectPr></w:body></w:document>` },
  ], SAVE_AS.docx.type);
}

/* -------------------------------------------------------- an OpenDocument -- */

const O_NS = [
  'xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"',
  'xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0"',
  'xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"',
  'xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0"',
  'xmlns:xlink="http://www.w3.org/1999/xlink"',
].join(" ");

/* OpenDocument throws away all but the first of a run of spaces, and the
   first one too at the start of a line, unless it is told not to with a
   <text:s/> — which is what keeps indented code indented. Only the start of
   a line counts as the start: the space after a bold word is in the middle
   of the paragraph however many spans it is split across, and writing that
   one as an element loses it in any reader that takes the text content and
   leaves it at that. */
function odfText(text, lineStart) {
  return text.split("\n").map((line, i) => {
    const begins = lineStart || i > 0;
    return line.split("\t").map((piece, j) => xmlEsc(piece).replace(/ +/g, (run, at) => {
      if (at === 0 && begins && j === 0) {
        return run.length === 1 ? "<text:s/>" : `<text:s text:c="${run.length}"/>`;
      }
      return run.length === 1 ? " " : ` <text:s text:c="${run.length - 1}"/>`;
    })).join("<text:tab/>");
  }).join("<text:line-break/>");
}

function odfRuns(runs, spans) {
  let out = "";
  let lineStart = true;
  for (const run of runs) {
    if (run.br) { out += "<text:line-break/>"; lineStart = true; continue; }
    const style = spans.id(run);
    const text = odfText(run.text, lineStart);
    if (run.text) lineStart = /\n\s*$/.test(run.text);
    const body = style ? `<text:span text:style-name="${style}">${text}</text:span>` : text;
    out += run.href
      ? `<text:a xlink:type="simple" xlink:href="${xmlEsc(run.href)}">${body}</text:a>`
      : body;
  }
  return out;
}

async function asOdt(title) {
  // One automatic style per combination of marks actually used, named as it is
  // first met, rather than a span nested inside a span inside a span.
  const made = new Map();
  const spans = {
    id(run) {
      const key = ["b", "i", "u", "s", "code"].filter((mark) => run[mark]).join("");
      if (!key) return "";
      if (!made.has(key)) {
        const props = [];
        if (run.b) props.push('fo:font-weight="bold" style:font-weight-asian="bold"');
        if (run.i) props.push('fo:font-style="italic" style:font-style-asian="italic"');
        if (run.u) props.push('style:text-underline-style="solid" style:text-underline-width="auto"'
          + ' style:text-underline-color="font-color"');
        if (run.s) props.push('style:text-line-through-style="solid" style:text-line-through-type="single"');
        if (run.code) props.push('style:font-name="Consolas" fo:font-family="Consolas, monospace" fo:font-size="10pt"');
        made.set(key, { name: `T${made.size + 1}`, props: props.join(" ") });
      }
      return made.get(key).name;
    },
  };

  const lists = new Map();
  const body = [];
  for (const block of blocksOf(renderedTree())) {
    const style = block.quote ? "Quotation" : "Standard";
    if (block.kind === "rule") {
      body.push('<text:p text:style-name="Rule"/>');
    } else if (block.kind === "code") {
      for (const row of block.text.split("\n")) {
        body.push(`<text:p text:style-name="Preformatted_20_Text">${odfText(row, true)}</text:p>`);
      }
    } else if (block.kind === "heading") {
      body.push(`<text:h text:style-name="Heading_20_${block.level}" text:outline-level="${block.level}">`
        + `${odfRuns(block.runs, spans)}</text:h>`);
    } else if (block.kind === "item") {
      // Items of one list have to sit inside one <text:list>, or every item is
      // a list of one and a numbered list reads 1. 1. 1.
      let open = lists.get(block.list);
      if (!open) {
        open = { ordered: block.ordered, items: [], at: body.length };
        lists.set(block.list, open);
        body.push(open);
      }
      open.items.push(`<text:list-item><text:p text:style-name="List_20_Paragraph">`
        + `${odfRuns(block.runs, spans)}</text:p></text:list-item>`);
    } else {
      body.push(`<text:p text:style-name="${style}">${odfRuns(block.runs, spans)}</text:p>`);
    }
  }

  const flat = body.map((part) => typeof part === "string" ? part
    : `<text:list text:style-name="${part.ordered ? "LNumber" : "LBullet"}">${part.items.join("")}</text:list>`);
  if (!flat.length) flat.push('<text:p text:style-name="Standard"/>');

  const listStyle = (name, ordered) =>
    `<text:list-style style:name="${name}">`
    + [1, 2, 3].map((level) => ordered
      ? `<text:list-level-style-number text:level="${level}" style:num-suffix="." style:num-format="1">`
        + `<style:list-level-properties text:space-before="${level * 0.6}cm" text:min-label-width="0.6cm"/>`
        + "</text:list-level-style-number>"
      : `<text:list-level-style-bullet text:level="${level}" text:bullet-char="•">`
        + `<style:list-level-properties text:space-before="${level * 0.6}cm" text:min-label-width="0.6cm"/>`
        + "</text:list-level-style-bullet>").join("")
    + "</text:list-style>";

  const content = `<?xml version="1.0" encoding="UTF-8"?>
<office:document-content ${O_NS} office:version="1.2">
<office:automatic-styles>
${[...made.values()].map((span) =>
  `<style:style style:name="${span.name}" style:family="text"><style:text-properties ${span.props}/></style:style>`).join("\n")}
${listStyle("LBullet", false)}
${listStyle("LNumber", true)}
</office:automatic-styles>
<office:body><office:text>
${flat.join("\n")}
</office:text></office:body>
</office:document-content>`;

  const heading = (level, size) =>
    `<style:style style:name="Heading_20_${level}" style:display-name="Heading ${level}"`
    + ' style:family="paragraph" style:parent-style-name="Standard">'
    + `<style:paragraph-properties fo:margin-top="${level === 1 ? "0cm" : "0.42cm"}" fo:margin-bottom="0.21cm" fo:keep-with-next="always"/>`
    + `<style:text-properties fo:font-size="${size}pt" fo:font-weight="bold"/></style:style>`;

  const styles = `<?xml version="1.0" encoding="UTF-8"?>
<office:document-styles ${O_NS} office:version="1.2">
<office:styles>
<style:style style:name="Standard" style:family="paragraph" style:class="text">
<style:paragraph-properties fo:margin-bottom="0.32cm" fo:line-height="140%"/>
<style:text-properties style:font-name="Calibri" fo:font-family="Calibri" fo:font-size="11pt"/></style:style>
${[[1, 17], [2, 14], [3, 12], [4, 11], [5, 11], [6, 11]].map(([level, size]) => heading(level, size)).join("\n")}
<style:style style:name="List_20_Paragraph" style:display-name="List Paragraph" style:family="paragraph" style:parent-style-name="Standard">
<style:paragraph-properties fo:margin-bottom="0.11cm"/></style:style>
<style:style style:name="Quotation" style:family="paragraph" style:parent-style-name="Standard">
<style:paragraph-properties fo:margin-left="1cm" fo:padding-left="0.3cm" fo:border-left="0.06cm solid #c9c4b8"/>
<style:text-properties fo:font-style="italic"/></style:style>
<style:style style:name="Preformatted_20_Text" style:display-name="Preformatted Text" style:family="paragraph" style:parent-style-name="Standard">
<style:paragraph-properties fo:margin-left="0.6cm" fo:margin-bottom="0cm" fo:line-height="100%"/>
<style:text-properties style:font-name="Consolas" fo:font-family="Consolas, monospace" fo:font-size="10pt"/></style:style>
<style:style style:name="Rule" style:family="paragraph" style:parent-style-name="Standard">
<style:paragraph-properties fo:border-bottom="0.02cm solid #c9c4b8" fo:margin-top="0.5cm" fo:margin-bottom="0.5cm"/></style:style>
</office:styles>
</office:document-styles>`;

  return zipUp([
    // First, stored, uncompressed: the format says so, and an unzipper that
    // sniffs the type reads it straight out of the front of the file.
    { name: "mimetype", body: SAVE_AS.odt.type, store: true },
    { name: "META-INF/manifest.xml", body: `<?xml version="1.0" encoding="UTF-8"?>
<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2">
<manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="${SAVE_AS.odt.type}"/>
<manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/>
<manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/>
<manifest:file-entry manifest:full-path="meta.xml" manifest:media-type="text/xml"/>
</manifest:manifest>` },
    { name: "meta.xml", body: `<?xml version="1.0" encoding="UTF-8"?>
<office:document-meta ${O_NS} xmlns:dc="http://purl.org/dc/elements/1.1/" office:version="1.2">
<office:meta><dc:title>${xmlEsc(title)}</dc:title>
<dc:date>${new Date().toISOString().replace(/\.\d+/, "")}</dc:date></office:meta>
</office:document-meta>` },
    { name: "styles.xml", body: styles },
    { name: "content.xml", body: content },
  ], SAVE_AS.odt.type);
}

/* -------------------------------------------------------- handing it over -- */

async function bodyFor(kind, title) {
  if (kind === "docx") return asDocx(title);
  if (kind === "odt") return asOdt(title);
  const text = kind === "html" ? asHtml(title) : kind === "rtf" ? asRtf() : sheet.value;
  return new Blob([text], { type: SAVE_AS[kind].type });
}

async function download(kind) {
  const format = SAVE_AS[kind] ? kind : "md";
  const name = (nameOf(current()) || "page").replace(/[^\w .-]+/g, " ").trim().slice(0, 60) || "page";
  let blob;
  try {
    blob = await bodyFor(format, nameOf(current()));
  } catch (err) {
    flash(`That would not save as .${format} — ${err.message}`);
    return;
  }
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${name}.${format}`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  flash(`Saved ${link.download}`);
}

el("saveBtn").addEventListener("click", () => download(prefs.save));
el("saveSel").addEventListener("change", () => {
  prefs.save = el("saveSel").value;
  applyPrefs();
});

el("openBtn").addEventListener("click", () => el("fileIn").click());
el("fileIn").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const text = await file.text();
  docs.push({ id: fresh(), title: file.name.replace(/\.[^.]+$/, ""), text, updated: Date.now() });
  save(STORE, docs);
  show(docs[docs.length - 1].id);
  flash(`Opened ${file.name}`);
});

/* --------------------------------------------------------------- the bar -- */

let barTimer = null;

function openBar(sticky = false) {
  bar.classList.add("open");
  clearTimeout(barTimer);
  if (!sticky) barTimer = setTimeout(() => bar.classList.remove("open"), 2400);
}
function closeBar() {
  clearTimeout(barTimer);
  if (bar.matches(":hover") || el("peek").matches(":hover")) return;
  const focused = document.activeElement;
  try {
    if (bar.contains(focused) && focused.matches(":focus-visible")) return;
  } catch { if (bar.contains(focused)) return; }
  bar.classList.remove("open");
}

let hideTimer = null;

function wantBar(wanted) {
  clearTimeout(hideTimer);
  if (wanted) { clearTimeout(barTimer); bar.classList.add("open"); return; }
  // A breath before closing, so crossing the seam between the strip and the
  // bar does not shut it under the hand.
  hideTimer = setTimeout(closeBar, 140);
}

for (const target of [el("peek"), bar]) {
  target.addEventListener("mouseenter", () => wantBar(true));
  target.addEventListener("mouseleave", () => wantBar(false));
}

/* ------------------------------------------------------------ the wiring -- */

sheet.addEventListener("input", () => { remember(); count(); typewriter(); });
sheet.addEventListener("keyup", (e) => { if (e.key.startsWith("Arrow") || e.key === "Enter") typewriter(); });
sheet.addEventListener("click", typewriter);
titleIn.addEventListener("input", () => { remember(); listDocs(); });

// The pointer goes away while the keyboard is in use, and comes back the
// moment the mouse moves.
let typingTimer = null;
document.addEventListener("keydown", () => {
  document.body.dataset.typing = "yes";
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { document.body.dataset.typing = "no"; }, 2000);
});
document.addEventListener("mousemove", () => {
  clearTimeout(typingTimer);
  document.body.dataset.typing = "no";
});

for (const [id, key] of [["paperSel", "paper"], ["fontSel", "font"], ["sizeSel", "size"], ["widthSel", "width"]]) {
  el(id).addEventListener("change", () => { prefs[key] = el(id).value; applyPrefs(); typewriter(); });
}
for (const [id, key] of [["focusBtn", "focus"], ["typerBtn", "typewriter"], ["tallyBtn", "tally"]]) {
  el(id).addEventListener("click", () => { prefs[key] = !prefs[key]; applyPrefs(); typewriter(); });
}

el("fullBtn").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { flash("This browser would not go full screen"); }
});

document.addEventListener("keydown", (e) => {
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === "s") { e.preventDefault(); download(prefs.save); }
  else if (meta && e.key.toLowerCase() === "p") { e.preventDefault(); togglePreview(); }
  else if (e.key === "Escape") {
    if (!preview.hidden) togglePreview(false);
    else bar.classList.remove("open");
  }
});

window.addEventListener("beforeunload", () => {
  clearTimeout(writeTimer);
  save(STORE, docs);
  save("blank-page.current", currentId);
});

applyPrefs();
show(currentId);
// Shown once on arrival, because a menu nobody can find is not a menu.
openBar();
</script>
</body>
</html>
